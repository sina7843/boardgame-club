<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>گوشی ۵: ارتقای سرباز</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../ds/bgv/tokens.css">
<link rel="stylesheet" href="../ds/bgv/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>

body{margin:0}
.cx-doc{font-family:var(--font-fa);background:#E9E4DA;color:#142B3B;padding:40px;display:grid;gap:56px;align-content:start}
.cx-doc[data-page="phone"]{gap:40px}
.cx-cap{display:block;max-inline-size:1440px}
.cx-cap>*+*{margin-block-start:6px}
.cx-cap h2{margin:0;font-size:26px;line-height:1.5;font-weight:900;color:#142B3B}
.cx-cap h2>.cx-tag{margin-inline-end:12px;vertical-align:4px}
.cx-cap h2>small{margin-inline-start:12px}
.cx-cap h2 small{font-size:15px;font-weight:700;color:#8D581A}
.cx-cap p{margin:0;font-size:15px;line-height:1.8;color:#3A4F5E;max-inline-size:1100px}
.cx-cap ul{margin:0;padding-inline-start:20px;font-size:14.5px;line-height:1.8;color:#3A4F5E}
.cx-shot{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.cx-shot>*{flex:none}
.cx-shot>.cx-cap{inline-size:1440px}
.cx-frame{inline-size:1440px;block-size:900px;overflow:hidden;position:relative;border-radius:14px;box-shadow:0 2px 0 rgba(20,43,59,.12),0 20px 40px -24px rgba(20,43,59,.5)}
.cx-pair{display:grid;grid-template-columns:repeat(2,700px);gap:40px}
.cx-pair>.cx-frame{inline-size:700px;block-size:820px}
.cx-tag{display:inline-flex;align-items:center;gap:6px;block-size:26px;padding-inline:10px;border-radius:6px;background:#142B3B;color:#FAF5EC;font-size:13px;font-weight:700}

/* ---------- board ---------- */
.cx-board{--sq:calc(var(--b,688px) / 8);position:relative;inline-size:var(--b,688px);block-size:var(--b,688px);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:4px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.28);user-select:none;flex:none}
.sq{position:relative;display:block}
.sq.l{background:#F0EED6}
.sq.d{background:#6F8F4E}
.sq.is-last::before,.sq.is-sel::before,.sq.is-pre::before,.sq.is-check::before{content:"";position:absolute;inset:0}
.sq.is-last::before{background:rgba(245,230,99,.55)}
.sq.is-sel::before{background:rgba(245,230,99,.72)}
.sq.is-pre::before{background:rgba(229,72,77,.45)}
.sq.is-check::before{background:radial-gradient(circle,rgba(229,72,77,.95) 0,rgba(229,72,77,.55) 34%,rgba(229,72,77,0) 70%)}
.sq.is-hover{box-shadow:inset 0 0 0 calc(var(--sq) * .06) rgba(255,255,255,.75)}
.sq.is-dot::after{content:"";position:absolute;inset:36%;border-radius:50%;background:rgba(0,0,0,.16)}
.sq.is-cap::after{content:"";position:absolute;inset:4%;border-radius:50%;box-shadow:inset 0 0 0 calc(var(--sq) * .075) rgba(0,0,0,.16)}
.pc{position:absolute;inset:0;z-index:1;background-size:100% 100%;background-repeat:no-repeat;display:block}
.pc.is-ghost{opacity:.35}
.co{position:absolute;z-index:2;font:700 calc(var(--sq) * .2)/1 var(--font-latin);pointer-events:none}
.sq.l .co{color:#6F8F4E}
.sq.d .co{color:#F0EED6}
.co-r{inset-block-start:5%;inset-inline-start:6%}
.co-f{inset-block-end:4%;inset-inline-end:6%}
.cx-arrows{position:absolute;inset:0;inline-size:100%;block-size:100%;z-index:3;pointer-events:none}
.cx-arrows line{stroke:#F29E2E;opacity:.8}
.cx-arrows polygon{fill:#F29E2E;opacity:.8}
.cx-promo{position:absolute;z-index:5;inset-block-start:0;inset-inline-start:calc(var(--f) * 12.5%);inline-size:12.5%;display:grid;grid-template-rows:repeat(4,var(--sq)) auto;background:#FFFFFF;box-shadow:0 6px 18px rgba(0,0,0,.45);border-radius:0 0 6px 6px}
.cx-promo__p{position:relative;border:0;padding:0;background:radial-gradient(circle,#F3F3F3 0,#E3E3E3 62%,#BDBDBD 63%,#FFFFFF 66%);cursor:pointer}
.cx-promo__p:first-child{background:radial-gradient(circle,#FCE7B2 0,#F5C451 62%,#D19A1E 63%,#FFFFFF 66%)}
.cx-promo__x{block-size:calc(var(--sq) * .5);border:0;background:#F1F1F1;color:#59666B;display:grid;place-items:center;cursor:pointer}
.cx-promo__x .bgv-icon{inline-size:18px;block-size:18px}
.cx-scrim-board{position:absolute;inset:0;z-index:4;background:rgba(0,0,0,.38)}

/* ---------- clock ---------- */
.cx-clock{--w:136px;display:inline-flex;align-items:center;justify-content:flex-end;gap:8px;inline-size:var(--w);block-size:46px;padding-inline:12px;border-radius:6px;background:var(--felt-plate);color:var(--felt-muted);flex:none;box-sizing:border-box;position:relative}
.cx-clock__t{font:900 28px/1 var(--font-fa);direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.cx-clock--sm{--w:104px;block-size:38px;padding-inline:10px}
.cx-clock--sm .cx-clock__t{font-size:22px}
.cx-clock__ic{inline-size:18px;block-size:18px;margin-inline-end:auto}
.cx-clock__tick{inline-size:8px;block-size:8px;border-radius:50%;background:currentColor;margin-inline-end:auto;opacity:.8}
.cx-clock[data-state="idle"]{opacity:.82}
.cx-clock[data-state="pre"]{opacity:.55}
.cx-clock[data-state="run"]{background:var(--felt-control);color:var(--brand-ink)}
.cx-clock[data-state="warn"]{background:#F1BD66;color:#142B3B}
.cx-clock[data-state="crit"]{background:#C2413A;color:#FFFFFF;box-shadow:0 0 0 3px rgba(240,170,163,.45)}
.cx-clock[data-state="flag"]{background:#7E2A26;color:#FFFFFF}
.cx-clock[data-state="off"]{background:transparent;color:var(--felt-muted);box-shadow:inset 0 0 0 1.5px var(--felt-line);opacity:1}
.cx-clock[data-state="crit"] .cx-clock__tick{animation:cx-pulse .5s steps(2) infinite}
@keyframes cx-pulse{50%{opacity:.2}}

/* ---------- player bar ---------- */
.cx-pbar{display:flex;align-items:center;gap:10px;inline-size:var(--b,688px);block-size:52px;color:var(--felt-ink);flex:none;box-sizing:border-box}
.cx-pbar>.bgv-avatar{box-shadow:0 0 0 2px var(--felt)}
.cx-pbar__id{flex:1;min-inline-size:0;display:grid;gap:2px}
.cx-pbar__name{display:flex;align-items:center;gap:8px;font-size:15px;white-space:nowrap;min-inline-size:0}
.cx-pbar__name b{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.cx-rating{color:var(--felt-muted);font-size:13.5px;font-weight:700}
.cx-pbar .bgv-league{color:var(--felt-muted)}
.cx-pbar__caps{display:flex;align-items:center;block-size:22px;min-inline-size:0}
.cx-capbox{display:inline-flex;align-items:center;block-size:22px;padding-inline:3px 10px;border-radius:6px}
.cx-capbox--b{background:#E9E4DA;box-shadow:inset 0 0 0 1px rgba(20,43,59,.18)}
.cx-capt{position:relative!important;inset:auto!important;inline-size:20px;block-size:20px;flex:none;margin-inline-end:-7px}
.cx-capbox+.cx-lead{margin-inline-start:8px}
.cx-lead{font:700 13px/1 var(--font-fa);color:var(--felt-muted);margin-inline-start:12px}
.cx-pbar__note{font-size:12.5px;color:var(--felt-muted);margin-inline-start:12px}
.cx-pbar--sm{block-size:46px;gap:8px}
.cx-pbar--sm .cx-pbar__name{font-size:14px}
.cx-pill{display:inline-flex;align-items:center;gap:4px;block-size:20px;padding-inline:7px;border-radius:5px;font-size:11.5px;font-weight:700;background:rgba(250,245,236,.12);color:var(--felt-ink)}
.cx-pill--live{background:#C2413A;color:#fff}
.cx-pill--off{background:rgba(240,170,163,.18);color:#F0AAA3}

/* ---------- table frame (DS th-desk: rail | felt | chat) ---------- */
.cx-desk{display:grid;grid-template-columns:380px minmax(0,1fr) 340px;grid-template-rows:var(--gamebar-h) minmax(0,1fr);block-size:900px;background:var(--bg)}
.cx-desk>.bgv-gamebar{grid-column:1/-1}
.cx-felt{background:var(--felt);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px 16px;position:relative;min-inline-size:0}
.cx-rail{display:flex;flex-direction:column;gap:10px;padding:12px;min-block-size:0;overflow:hidden;background:var(--bg)}
.cx-chatcol{min-block-size:0;display:flex;border-inline-start:1px solid var(--line)}
.cx-chatcol>.bgv-chat{flex:1;border-radius:0}
.cx-card{background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-card),var(--shadow-ring);padding:14px;display:grid;gap:10px;align-content:start}
.cx-card--fill{flex:1;min-block-size:0;grid-template-rows:auto auto minmax(0,1fr) auto}
.cx-card h3{margin:0;font-size:15px;font-weight:700;color:var(--heading);display:flex;align-items:center;gap:8px}
.cx-status{display:flex;align-items:center;gap:10px;font-size:15px;line-height:1.6;color:var(--text)}
.cx-status b{color:var(--heading)}
.cx-status .bgv-icon{flex:none}
.cx-status--check{color:var(--danger)}
.cx-dot-turn{inline-size:10px;block-size:10px;border-radius:50%;background:var(--success);flex:none;box-shadow:0 0 0 4px var(--success-soft)}
.cx-ml{display:grid;grid-template-columns:40px 1fr 1fr;gap:2px 6px;align-content:start;overflow:hidden;font-size:15px}
.cx-ml__n{color:var(--text-muted);font-size:13.5px;padding-block:4px;font-weight:700}
.cx-ml__m{border:0;background:none;text-align:left;font:700 15px/1.2 var(--font-latin);color:var(--text);padding:5px 8px;border-radius:5px;cursor:pointer}
.cx-ml__m.is-cur{background:var(--selected);color:var(--on-selected)}
.cx-ml__m.is-pre{background:rgba(229,72,77,.18);color:var(--danger);outline:1.5px dashed rgba(229,72,77,.6)}
.cx-mlhead{display:grid;grid-template-columns:40px 1fr 1fr;gap:6px;font-size:12.5px;color:var(--text-muted);font-weight:700;padding-block-end:6px;border-block-end:1px solid var(--line)}
.cx-nav{display:flex;justify-content:center;gap:4px;padding-block-start:6px;border-block-start:1px solid var(--line)}
.cx-actions{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px}
.cx-actions .bgv-btn{padding-inline:12px;min-inline-size:0}
.cx-actions .bgv-btn{white-space:nowrap}
.cx-round{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text)}
.cx-round b{color:var(--heading)}
.cx-round .bgv-icon{color:var(--warning)}
.cx-mini{display:grid;grid-template-columns:24px 1fr auto auto;gap:4px 10px;font-size:13.5px;align-items:center}
.cx-mini .is-you{font-weight:900;color:var(--heading)}
.cx-mini span:nth-child(4n+1){color:var(--text-muted);font-weight:700}
.cx-offer{display:grid;gap:10px;padding:14px;border-radius:var(--radius-md);background:var(--invite-soft);box-shadow:inset 0 0 0 1.5px var(--invite)}
.cx-offer__t{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--text)}
.cx-offer__row{display:flex;gap:8px}
.cx-offer__row .bgv-btn{flex:1}
.cx-note{font-size:13px;color:var(--text-muted);line-height:1.6}
.cx-banner{position:absolute;z-index:6;inset-inline:16px;inset-block-start:12px;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;font-size:14.5px;line-height:1.5;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.cx-banner--lost{background:#3A2326;color:#F4D6D2;box-shadow:inset 0 0 0 1.5px #B4706D,0 6px 0 rgba(0,0,0,.25)}
.cx-banner--retry{background:#453723;color:#F9E3BC;box-shadow:inset 0 0 0 1.5px #B57A25,0 6px 0 rgba(0,0,0,.25)}
.cx-banner--info{background:#203E4D;color:#D7ECF3;box-shadow:inset 0 0 0 1.5px #5E95AA,0 6px 0 rgba(0,0,0,.25)}
.cx-banner b{color:#fff}
.cx-banner .bgv-btn{margin-inline-start:auto}
.cx-spin{inline-size:16px;block-size:16px;border-radius:50%;border:2.5px solid currentColor;border-inline-end-color:transparent;flex:none}

/* ---------- dialogs over the board ---------- */
.cx-over{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:var(--scrim)}
.cx-result{inline-size:400px;background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-float),var(--shadow-ring);overflow:hidden;display:grid}
.cx-result__head{padding:22px 22px 16px;display:grid;justify-items:center;gap:6px;text-align:center;background:linear-gradient(var(--felt),var(--felt-plate));color:var(--felt-ink)}
.cx-result__head h3{margin:0;font-size:30px;font-weight:900;color:#fff}
.cx-result__head p{margin:0;font-size:15px;color:var(--felt-muted)}
.cx-result__head .cx-aic{inline-size:40px;block-size:40px;color:var(--felt-gold)}
.cx-vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:16px 20px}
.cx-vs__p{display:grid;justify-items:center;gap:6px;font-size:14px;text-align:center}
.cx-vs__p b{font-size:15px;color:var(--heading)}
.cx-vs__p.is-win .bgv-avatar{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--success)}
.cx-vs__score{font:900 26px/1 var(--font-fa);color:var(--heading);direction:ltr}
.cx-delta{font:700 13.5px/1 var(--font-fa);direction:ltr;unicode-bidi:isolate}
.cx-delta--up{color:var(--success)}.cx-delta--down{color:var(--danger)}.cx-delta--eq{color:var(--text-muted)}
.cx-result__btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 14px}
.cx-result__btns .bgv-btn--primary{grid-column:1/-1}
.cx-result__foot{display:flex;justify-content:center;gap:4px;padding:10px 12px 14px;border-block-start:1px solid var(--line)}
.cx-reasons{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;inline-size:1440px}
.cx-reason{background:#fff;border-radius:12px;padding:14px;display:grid;gap:6px;box-shadow:0 2px 0 #DDD5C8;align-content:start}
.cx-reason b{font-size:17px;font-weight:900}
.cx-reason span{font-size:13.5px;color:#3A4F5E;line-height:1.6}
.cx-reason code{font:700 12px/1.4 var(--font-latin);color:#8D581A;direction:ltr;unicode-bidi:isolate}
.cx-reason--w b{color:#2E6B4F}.cx-reason--l b{color:#A83F39}.cx-reason--d b{color:#2B657A}.cx-reason--x b{color:#59666B}

/* ---------- picker / lobby ---------- */
.cx-lobby{display:grid;grid-template-columns:480px minmax(0,1fr);block-size:calc(900px - var(--gamebar-h))}
.cx-lobby__side{background:var(--surface);padding:22px 24px;display:flex;flex-direction:column;gap:16px;overflow:hidden;border-inline-end:1px solid var(--line)}
.cx-lobby__stage{background:var(--felt);display:grid;place-items:center;position:relative}
.cx-h{margin:0;font-size:24px;font-weight:900;color:var(--heading)}
.cx-tc{display:grid;gap:10px}
.cx-tc__grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cx-tile{display:grid;justify-items:center;align-content:center;gap:4px;block-size:84px;border:0;border-radius:var(--radius-md);background:var(--btn-neutral);color:var(--heading);box-shadow:var(--shadow-tile);cursor:pointer;font:inherit;position:relative}
.cx-tile b{font:900 22px/1.1 var(--font-fa)}
.cx-tile small{font-size:12.5px;color:var(--text-muted);font-weight:700;display:inline-flex;align-items:center;gap:4px}
.cx-tile small .cx-aic{inline-size:15px;block-size:15px;color:var(--warning)}
.cx-tile[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow-tile-primary)}
.cx-tile[aria-pressed="true"] small,.cx-tile[aria-pressed="true"] small .cx-aic{color:var(--on-primary)}
.cx-tile--inc{block-size:64px}
.cx-tile--inc b{font-size:19px;direction:ltr;unicode-bidi:isolate}
.cx-more{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;font:700 14.5px var(--font-fa);color:var(--link);cursor:pointer}
.cx-more .bgv-icon{inline-size:18px;block-size:18px;transform:rotate(180deg)}
.cx-hint{font-size:13px;color:var(--text-muted);line-height:1.6;margin:0}
.cx-row{display:flex;align-items:center;gap:12px}
.cx-row--between{justify-content:space-between}
.cx-colors{display:inline-flex;gap:6px}
.cx-colors button{inline-size:44px;block-size:44px;border-radius:10px;border:0;background:var(--surface-sunken);box-shadow:inset 0 0 0 1.5px var(--field-edge);position:relative;cursor:pointer}
.cx-colors button[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--selected)}
.cx-colors .pc{inset:4px}
.cx-colors .cx-half{position:absolute;inset:10px;border-radius:50%;background:linear-gradient(90deg,#fff 50%,#2B2B2B 50%);box-shadow:0 0 0 1.5px #1A1A1A}
.cx-cta{block-size:56px;font-size:18px}
.cx-aic{inline-size:20px;block-size:20px;flex:none}
.cx-cat{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--label)}
.cx-cat .cx-aic{color:var(--warning)}
.cx-seek{display:grid;justify-items:center;gap:14px;text-align:center;color:var(--felt-ink);padding:28px 36px;border-radius:18px;background:var(--felt-plate);box-shadow:var(--shadow-ring-felt)}
.cx-seek h3{margin:0;font-size:22px;font-weight:900;color:#fff}
.cx-seek p{margin:0;font-size:15px;color:var(--felt-muted)}
.cx-seek__t{font:900 34px/1 var(--font-fa);direction:ltr}
.cx-ring{inline-size:72px;block-size:72px;border-radius:50%;border:6px solid rgba(250,245,236,.16);border-block-start-color:var(--felt-gold)}
.cx-tourcard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:var(--radius-md);background:var(--surface-sunken);box-shadow:var(--shadow-ring)}
.cx-tourcard .cx-aic{inline-size:30px;block-size:30px;color:var(--warning)}
.cx-tourcard b{display:block;font-size:15px;color:var(--heading)}
.cx-tourcard span{font-size:13px;color:var(--text-muted)}

.cx-catrow{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:10px}
.cx-catrow__tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cx-catrow .cx-tile{block-size:58px}
.cx-catrow .cx-tile b{font-size:18px;display:inline-flex;gap:.32em;align-items:baseline}
.cx-inc{display:inline-flex;gap:.28em;align-items:baseline}.cx-inc i{font-style:normal;font-weight:700;opacity:.7}
.cx-catrow .cx-tile--inc b{font-size:18px}
.cx-tc{display:grid;gap:12px}
.cx-phone .cx-catrow{grid-template-columns:64px 1fr;gap:6px}
.cx-phone .cx-catrow__tiles{gap:6px}
.cx-phone .cx-catrow .cx-tile{block-size:50px}
.cx-phone .cx-catrow .cx-tile b{font-size:15px}
/* ---------- phone ---------- */
.cx-phones{display:grid;grid-template-columns:repeat(6,390px);gap:48px 40px;align-items:start}
.cx-ph{display:grid;gap:10px;justify-items:start}
.cx-ph__cap{font-size:15px;font-weight:900;color:#142B3B;display:flex;gap:8px;align-items:baseline}
.cx-ph__cap small{font-size:13px;font-weight:700;color:#8D581A}
.cx-ph__note{font-size:13px;color:#3A4F5E;line-height:1.6;inline-size:390px;margin:0}
.cx-phone{inline-size:390px;block-size:844px;overflow:hidden;position:relative;border-radius:22px;box-shadow:0 2px 0 rgba(20,43,59,.12),0 20px 40px -24px rgba(20,43,59,.5);display:flex;flex-direction:column;background:var(--felt)}
.cx-phone>.bgv-gamebar{flex:none;background:var(--surface-chrome)}
.cx-pfelt{flex:1;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:6px;padding-block:8px;min-block-size:0;position:relative}
.cx-pfelt .cx-pbar{inline-size:auto;padding-inline:10px}
.cx-pfelt .cx-board{--b:390px;border-radius:0;box-shadow:none}
.cx-pstat{margin:0 10px;display:flex;align-items:center;gap:8px;min-block-size:36px;padding:6px 12px;border-radius:10px;background:var(--felt-plate);color:var(--felt-ink);font-size:14px;line-height:1.5}
.cx-pstat b{color:#fff}
.cx-pstat--check{background:#3A2326;color:#F4D6D2}
.cx-pstat--pre{background:#3A2326;color:#F4D6D2}
.cx-pdock{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface-chrome);border-block-start:1px solid var(--line);padding:6px 6px 22px}
.cx-pdock button{display:grid;justify-items:center;gap:3px;border:0;background:none;font:700 11.5px var(--font-fa);color:var(--text-muted);padding:6px 0;cursor:pointer}
.cx-pdock button .bgv-icon{inline-size:22px;block-size:22px;color:var(--text)}
.cx-pdock button[disabled]{opacity:.4}
.cx-pdock button.is-on{color:var(--link)}
.cx-pdock button.is-on .bgv-icon{color:var(--link)}

.cx-spec{display:grid;grid-template-columns:1fr 1fr;gap:28px;inline-size:1440px}
.cx-box{background:#fff;border-radius:14px;padding:22px 24px;box-shadow:0 2px 0 #DDD5C8;display:grid;gap:12px;align-content:start}
.cx-box--wide{grid-column:1/-1}
.cx-box h3{margin:0;font-size:19px;font-weight:900;color:#142B3B;display:flex;gap:10px;align-items:center}
