<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>بازی سریع، ورود به میز</title>
<link rel="stylesheet" href="../ds/bgv/tokens.css">
<link rel="stylesheet" href="../ds/bgv/components/bundle.css">
</head>
<body>
<x-dc>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&amp;family=Manrope:wght@600;800&amp;display=swap">
<style>
body{margin:0}
.pl-ul{list-style:none;padding:0;margin:0}
.pl-phone{position:relative;overflow:hidden;display:flex;flex-direction:column}
.pl-phone>.bgv-topbar{flex:none}
.pl-scroll{flex:1;min-height:0;overflow:hidden;padding:16px 16px 104px;display:flex;flex-direction:column;gap:16px}
.pl-scroll>*{flex:none}
.pl-h2{font-size:20px;font-weight:700;line-height:1.5;color:var(--heading);display:flex;align-items:center;gap:8px;margin:0;min-width:0}
.pl-h3{font-size:16px;font-weight:700;line-height:1.5;color:var(--heading);margin:0}
.pl-link{font-size:14px;font-weight:700;color:var(--link);text-decoration:none;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.pl-thumb{inline-size:96px;block-size:54px;border-radius:var(--radius-sm);object-fit:cover;flex:none;display:block;background:var(--surface-raised)}
.pl-muted{color:var(--text-muted)}
.pl-meta{display:flex;align-items:center;gap:4px 6px;flex-wrap:wrap;font-size:13px;color:var(--text-muted);min-width:0}
.pl-sechead{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.pl-sechead>.pl-h2{flex:1 1 auto}
.pl-cover-fallback{inline-size:100%;block-size:100%;display:grid;place-items:center;background:var(--surface-raised)}
.pl-cover-fallback img{inline-size:56px!important;block-size:56px!important;object-fit:contain!important;opacity:.55}
.pl-iconbox{display:grid;place-items:center;flex:none}
.bgv-pagetabs{flex:none}
.bgv-app{min-height:100vh}
.bgv-hero .bgv-clock[data-state="warn"]{--clock-c:var(--clock-on-felt-warn)}.bgv-hero .bgv-clock[data-state="critical"]{--clock-c:var(--clock-on-felt-critical)}
.pl-phone .bgv-pagetabs a{padding-inline:11px}
.pl-short{display:none}
@media (max-width:599px){.bgv-pagetabs a{padding-inline:11px}.pl-long{display:none}.pl-short{display:inline}}
.bgv-progress__row{flex-wrap:wrap;gap:0 8px}.bgv-progress__row>span{white-space:nowrap}

.pl-radar{position:relative;inline-size:200px;block-size:200px;margin:0 auto;display:grid;place-items:center}
.pl-radar>i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--heading);opacity:0;animation:pl-ping 2.4s var(--ease-out) infinite}
.pl-radar>i:nth-child(2){animation-delay:.8s}.pl-radar>i:nth-child(3){animation-delay:1.6s}
.pl-radar>b{position:absolute;inset:18px;border-radius:50%;border:1.5px dashed var(--line)}
.pl-radar>em{position:absolute;inset:52px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-card);border:1px solid var(--line)}
@keyframes pl-ping{0%{transform:scale(.38);opacity:.7}100%{transform:scale(1);opacity:0}}
.pl-orbit{position:absolute}
.pl-slot{inline-size:40px;block-size:40px;border-radius:50%;border:1.5px dashed var(--border);background:var(--surface);display:grid;place-items:center;color:var(--text-muted)}
.pl-skill{position:relative;block-size:12px;border-radius:var(--radius-pill);background:var(--surface-sunken);box-shadow:var(--shadow-field)}
.pl-skill .max{position:absolute;inset-block:0;inset-inline:0;border-radius:var(--radius-pill);background:var(--clock-track);border:1px dashed var(--border)}
.pl-skill .now{position:absolute;inset-block:0;inset-inline:25% 25%;border-radius:var(--radius-pill);background:var(--heading);opacity:.85}
.pl-skill .me{position:absolute;inset-block:-6px;inset-inline-start:50%;inline-size:3px;border-radius:var(--radius-pill);background:var(--heading);transform:translateX(50%)}
.pl-step{display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px}
.pl-step .dot{inline-size:28px;block-size:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.pl-step.done .dot{background:var(--success-soft);color:var(--success)}
.pl-step.now .dot{background:var(--heading);color:var(--surface)}
.pl-step.now{font-weight:700}
.pl-center{display:grid;justify-items:center;text-align:center;gap:6px}

</style>

<div class="bgv pl-phone" data-theme="light" dir="rtl" style="width: 390px; height: 844px; overflow: hidden;">
<header class="bgv-topbar"><a class="bgv-logo" href="/" aria-label="خانه"><img class="bgv-logo__light" src="../assets/symbol-primary-small.svg" alt="" style="block-size:32px"><img class="bgv-logo__dark" src="../assets/symbol-reversed-small.svg" alt="" style="block-size:32px"></a><span class="bgv-topbar__title">بازی سریع</span><a class="bgv-btn bgv-btn--ghost bgv-btn--icon" href="/search" aria-label="جست‌وجوی بازی"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8" /> <path d="m21 21-4.3-4.3" /></svg></a><a class="bgv-coinchip" href="/coins" aria-label="۲٬۴۸۰ سکه"><span class="bgv-coin bgv-coin--sm">۲٬۴۸۰</span></a><a class="bgv-btn bgv-btn--ghost bgv-btn--icon bgv-iconbtn-count" href="/notifications" aria-label="اعلان‌ها، ۵ خوانده‌نشده"><svg class="bgv-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /> <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" /></svg><span class="bgv-badge bgv-badge--count">۵</span></a></header>
<main class="pl-scroll" style="gap:12px"><div class="pl-center" style="gap:4px;padding-top:4px"><h1 class="t-title" style="margin:0;color:var(--heading)">در حال ورود به میز…</h1><span class="pl-muted" style="font-size:14px">همه آماده‌اند؛ چند لحظه صبر کنید.</span></div><div role="group" class="bgv-felt" style="block-size:236px;padding:0;position:relative" aria-label="پیش‌نمایش میز"><span class="bgv-felt-plate" style="position:absolute;inset-block-start:50%;inset-inline-start:50%;transform:translate(50%,-50%)">دسته <strong>۸۰</strong></span><span style="position:absolute;inset-block-start:14px;inset-inline-start:50%;transform:translateX(50%);display:grid;justify-items:center;gap:2px"><span class="bgv-avatar bgv-avatar--sm seat-5">س</span><span style="font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px"><i class="bgv-seat seat-5"></i>سارا</span></span><span style="position:absolute;inset-block-start:86px;inset-inline-start:24px;display:grid;justify-items:center;gap:2px"><span class="bgv-avatar bgv-avatar--sm seat-2">آ</span><span style="font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px"><i class="bgv-seat seat-2"></i>آرش</span></span><span style="position:absolute;inset-block-start:86px;inset-inline-end:24px;display:grid;justify-items:center;gap:2px"><span class="bgv-avatar bgv-avatar--sm seat-6">ب</span><span style="font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px"><i class="bgv-seat seat-6"></i>بهراد</span></span><span style="position:absolute;inset-block-end:12px;inset-inline-start:50%;transform:translateX(50%);display:grid;justify-items:center;gap:2px"><span class="bgv-avatar bgv-avatar--sm seat-4 is-you">م</span><span style="font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px"><i class="bgv-seat seat-4"></i>مینا</span></span></div><section class="bgv-card" style="padding:8px 16px;display:grid"><div class="pl-step done"><span class="dot"><svg class="bgv-icon bgv-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></span>همه آماده‌اند</div><div class="pl-step done"><span class="dot"><svg class="bgv-icon bgv-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></span>میز ساخته شد و کارت‌ها بُر خوردند</div><div class="pl-step now"><span class="dot"><svg class="bgv-icon bgv-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v3" /> <path d="M3 16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5a2 2 0 0 0-4 0v1.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V11a2 2 0 0 0-4 0z" /> <path d="M5 18v2" /> <path d="M19 18v2" /></svg></span>نشستن سر میز</div></section><section class="bgv-card bgv-card--raised" style="padding:12px 16px;display:grid;gap:6px"><div class="bgv-row" style="justify-content:space-between"><span class="pl-muted" style="font-size:14px">صندلی شما</span><b style="display:flex;align-items:center;gap:6px;font-size:15px"><i class="bgv-seat bgv-seat--lg seat-4" style="margin-inline:2px"></i>لوزی کرم</b></div><div class="bgv-row" style="justify-content:space-between"><span class="pl-muted" style="font-size:14px">نفر اول (قرعه)</span><b style="display:flex;align-items:center;gap:6px;font-size:15px"><i class="bgv-seat seat-5"></i>سارا</b></div></section><button class="bgv-btn bgv-btn--primary bgv-btn--lg bgv-btn--block is-loading" aria-busy="true">ورود به میز</button></main>
<nav class="bgv-dock bgv-dock--float" aria-label="بخش‌های اصلی"><a class="bgv-dock__item" href="/"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" /> <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg><span>خانه</span></a><a class="bgv-dock__item is-active" href="/tables" aria-current="page"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="12" height="12" x="2" y="10" rx="2" ry="2" /> <path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6" /> <path d="M6 18h.01" /> <path d="M10 14h.01" /> <path d="M15 6h.01" /> <path d="M18 9h.01" /></svg><span>میزها</span><span class="bgv-badge bgv-badge--count bgv-badge--count-invite" role="img" aria-label="۳ میز منتظر حرکت شما">۳</span></a><a class="bgv-dock__item" href="/messages"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" /></svg><span>پیام‌ها</span><span class="bgv-badge bgv-badge--count" role="img" aria-label="۴ تازه">۴</span></a><a class="bgv-dock__item" href="/more"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" x2="20" y1="12" y2="12" /> <line x1="4" x2="20" y1="6" y2="6" /> <line x1="4" x2="20" y1="18" y2="18" /></svg><span>بیشتر</span></a></nav>
</div>
</x-dc>
</body>
</html>
