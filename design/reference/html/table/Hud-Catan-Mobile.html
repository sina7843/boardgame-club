<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>کاتان ۴ نفره، موبایل</title>
<link rel="stylesheet" href="../ds/bgv/tokens.css">

<body>
<x-dc>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&amp;family=Manrope:wght@600;800&amp;display=swap">
<style>
body{margin:0}
.th-stage{position:relative;flex:1;min-block-size:0}
.th-stage>img{position:absolute;inset:0;inline-size:100%;block-size:100%;object-fit:contain}
.th .bgv-pcard--mini{padding:10px 12px}
.th .bgv-pcard--mini .bgv-pcard__stats{gap:6px!important;flex-wrap:nowrap}
.th .bgv-pcard--mini>.bgv-avatar{margin-block:4px 9px}
.th .bgv-pcard--mini .bgv-pcard__score{flex-wrap:wrap;row-gap:0}
.th .bgv-pcard--mini.is-leader .bgv-pcard__score::before{flex-basis:100%;text-align:center}
.th .bgv-pcard__top>.bgv-avatar{margin:4px}
.th .bgv-felt-plate{padding:8px 12px}
.th .bgv-turn{max-inline-size:100%;min-inline-size:0}
.th .bgv-turn__who{min-inline-size:0;overflow:hidden;text-overflow:ellipsis}
.th-img{display:block;max-inline-size:100%;block-size:auto;object-fit:contain;margin-inline:auto}
.th-tray{gap:6px;flex:none}
.th-tray .bgv-die{inline-size:28px;block-size:28px;border-radius:var(--radius-sm);font-size:14px}
.th-hand{display:block;margin-inline:auto;max-inline-size:100%;object-fit:contain}
/* qa1: phone game bar, meta items must not be clipped mid-word */
@media (max-width:899px){.bgv-gamebar__meta{gap:4px}.bgv-gamebar__meta .bgv-sep{margin-inline:3px}}
/* qa1: dock buttons size to their label (no text running into the button padding) */
.th .bgv-actiondock__actions>.bgv-btn{flex:1 1 auto!important}
.th .bgv-actiondock__actions>.bgv-btn--icon{flex:none!important}
/* qa1: dev-card button moves up to the prompt row so the three actions keep one row at full label width */
.th .bgv-actiondock__prompt{align-items:center}
.th .bgv-actiondock__prompt>.bgv-btn{margin-block:-6px}
</style>

<div class="bgv th" data-theme="light" dir="rtl" style="width: 390px; height: 844px; overflow: hidden; position: relative;">
<div class="bgv-tablescreen" style="height:844px">
<header class="bgv-gamebar"><button class="bgv-btn bgv-btn--icon bgv-btn--ghost" type="button" aria-label="بازگشت به میزها"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /> <path d="m12 5 7 7-7 7" /></svg></button><div class="bgv-gamebar__title"><span class="bgv-gamebar__name">کاتان<span class="bgv-latin" dir="ltr" style="font-size:12.5px;font-weight:600;color:var(--text-muted)">CATAN</span></span><span class="bgv-gamebar__meta">زنده<span class="bgv-sep"></span>۶۰ ثانیه هر نوبت<span class="bgv-sep"></span>نوبت ۲۵</span></div><button class="bgv-btn bgv-btn--icon bgv-btn--secondary bgv-iconbtn-count" type="button" aria-label="گفت‌وگوی میز، ۱ پیام تازه"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" /></svg><span class="bgv-badge bgv-badge--count">۱</span></button><button class="bgv-btn bgv-btn--icon bgv-btn--ghost" type="button" aria-label="گزینه‌های میز"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1" /> <circle cx="12" cy="5" r="1" /> <circle cx="12" cy="19" r="1" /></svg></button></header>
<section class="bgv-hud bgv-hud--strip" aria-label="بازیکنان، برای جزئیات بزنید"><div class="bgv-pcard bgv-pcard--mini is-you is-turn" style="--clock-c:var(--clock-calm)" role="button" tabindex="0" aria-label="مینا، برای جزئیات بزنید"><span class="bgv-avatar bgv-avatar--sm seat-1 is-you is-turn" style="--clock-c:var(--clock-calm);">م</span><div class="bgv-pcard__name"><b><i class="bgv-seat seat-1"></i><span class="bgv-sr">مینا</span></b><small>قرمز</small></div><div class="bgv-pcard__score">۲<small>امتیاز</small></div><div class="bgv-pcard__stats" style="gap:8px;justify-content:center"><span class="bgv-hstat" title="کارت منبع"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" /> <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" /> <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" /></svg>۳</span><span class="bgv-hstat" title="کارت توسعه"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2" /> <path d="M10 16c-1.1 0-2-.9-2-2v-4c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2" /> <rect width="8" height="8" x="14" y="14" rx="2" /></svg>۰</span></div></div><div class="bgv-pcard bgv-pcard--mini" role="button" tabindex="0" aria-label="نیلوفر، برای جزئیات بزنید"><span class="bgv-avatar bgv-avatar--sm seat-2">ن</span><div class="bgv-pcard__name"><b><i class="bgv-seat seat-2"></i>نیلوفر</b><small>آبی</small></div><div class="bgv-pcard__score">۲<small>امتیاز</small></div><div class="bgv-pcard__stats" style="gap:8px;justify-content:center"><span class="bgv-hstat" title="کارت منبع"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" /> <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" /> <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" /></svg>۱</span><span class="bgv-hstat" title="کارت توسعه"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2" /> <path d="M10 16c-1.1 0-2-.9-2-2v-4c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2" /> <rect width="8" height="8" x="14" y="14" rx="2" /></svg>۰</span></div></div><div class="bgv-pcard bgv-pcard--mini is-leader" role="button" tabindex="0" aria-label="آرش، برای جزئیات بزنید"><span class="bgv-avatar bgv-avatar--sm seat-3">آ</span><div class="bgv-pcard__name"><b><i class="bgv-seat seat-3"></i>آرش</b><small>سفید</small></div><div class="bgv-pcard__score">۳<small>امتیاز</small></div><div class="bgv-pcard__stats" style="gap:8px;justify-content:center"><span class="bgv-hstat" title="کارت منبع"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" /> <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" /> <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" /></svg>۳</span><span class="bgv-hstat" title="کارت توسعه"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2" /> <path d="M10 16c-1.1 0-2-.9-2-2v-4c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2" /> <rect width="8" height="8" x="14" y="14" rx="2" /></svg>۳</span></div></div><div class="bgv-pcard bgv-pcard--mini" role="button" tabindex="0" aria-label="سارا، برای جزئیات بزنید"><span class="bgv-avatar bgv-avatar--sm seat-4">س</span><div class="bgv-pcard__name"><b><i class="bgv-seat seat-4"></i>سارا</b><small>نارنجی</small></div><div class="bgv-pcard__score">۲<small>امتیاز</small></div><div class="bgv-pcard__stats" style="gap:8px;justify-content:center"><span class="bgv-hstat" title="کارت منبع"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" /> <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" /> <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" /></svg>۳</span><span class="bgv-hstat" title="کارت توسعه"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2" /> <path d="M10 16c-1.1 0-2-.9-2-2v-4c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2" /> <rect width="8" height="8" x="14" y="14" rx="2" /></svg>۰</span></div></div></section>
<main class="bgv-felt th-felt" style="padding:12px;gap:8px" aria-label="میز کاتان">
 <div class="bgv-felt-row" style="flex-wrap:nowrap"><span class="bgv-turn bgv-turn--mine" role="status"><span class="bgv-turn__who"><span class="bgv-avatar bgv-avatar--xs seat-1 is-you">م</span>نوبت شما</span><span class="bgv-turn__sep"></span><span class="bgv-clock" data-state="calm" style="--p:0.7;"><span class="bgv-clock__ring"></span><span class="bgv-clock__time">۰:۴۲</span></span></span><span class="bgv-felt-plate th-tray" aria-label="جای تاس. تاس قبلی سارا: ۵ و ۵، جمع ۱۰"><span class="bgv-die" style="opacity:.6">۵</span><span class="bgv-die" style="opacity:.6">۵</span><span style="color:var(--felt-muted);font-size:12px;line-height:1.35;white-space:nowrap">قبلی<br>سارا ۱۰</span></span></div>
 <div class="th-stage" style="--ar:728/718;"><img src="../assets/games/tablehud-catan-board-m.webp" alt="نقشهٔ جزیرهٔ کاتان از خود بازی" width="364" height="359"></div>
</main>
