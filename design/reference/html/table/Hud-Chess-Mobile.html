<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>شطرنج، موبایل</title>
<link rel="stylesheet" href="../ds/bgv/tokens.css">
<link rel="stylesheet" href="../ds/bgv/components/bundle.css">
</head>
<body>
<x-dc>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&amp;family=Manrope:wght@600;800&amp;display=swap">
<style>
body{margin:0}
.th-stage{position:relative;flex:1;min-block-size:0}
.th-stage>img{position:absolute;inset:0;inline-size:100%;block-size:100%;object-fit:contain}
.th .bgv-pcard--mini{padding:10px 12px}
.th .bgv-pcard--mini .bgv-pcard__stats{gap:6px!important;flex-wrap:nowrap}
.th .bgv-pcard--mini>.bgv-avatar{margin-block:4px 9px}
.th .bgv-pcard--mini .bgv-pcard__score{flex-wrap:wrap;row-gap:0}
.th .bgv-pcard--mini.is-leader .bgv-pcard__score::before{flex-basis:100%;text-align:center}
.th .bgv-pcard__top>.bgv-avatar{margin:4px}
.th .bgv-felt-plate{padding:8px 12px}
.th .bgv-turn{max-inline-size:100%;min-inline-size:0}
.th .bgv-turn__who{min-inline-size:0;overflow:hidden;text-overflow:ellipsis}
.th-img{display:block;max-inline-size:100%;block-size:auto;object-fit:contain;margin-inline:auto}
.th-duel{padding:10px 14px;gap:0}
.th-duel .bgv-pcard__top{gap:10px}
.th-mlog{grid-template-columns:32px 1fr 1fr;gap:4px 8px}
.th-mlog span{padding:2px 6px;border-radius:var(--radius-xs)}
.th-mlog .is-last{background:var(--surface-raised);font-weight:800}
.th-mlog .n{color:var(--text-muted)}
/* qa1: phone game bar, meta items must not be clipped mid-word */
@media (max-width:899px){.bgv-gamebar__meta{gap:4px}.bgv-gamebar__meta .bgv-sep{margin-inline:3px}}
/* qa1: dock buttons size to their label (no text running into the button padding) */
.th .bgv-actiondock__actions>.bgv-btn{flex:1 1 auto!important}
.th .bgv-actiondock__actions>.bgv-btn--icon{flex:none!important}
</style>

<div class="bgv th" data-theme="light" dir="rtl" style="width: 390px; height: 844px; overflow: hidden; position: relative;">
<div class="bgv-tablescreen" style="height:844px;grid-template-rows:var(--gamebar-h) minmax(0,1fr) auto">
<header class="bgv-gamebar"><button class="bgv-btn bgv-btn--icon bgv-btn--ghost" type="button" aria-label="بازگشت به میزها"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /> <path d="m12 5 7 7-7 7" /></svg></button><div class="bgv-gamebar__title"><span class="bgv-gamebar__name">شطرنج<span class="bgv-latin" dir="ltr" style="font-size:12.5px;font-weight:600;color:var(--text-muted)">CHESS</span></span><span class="bgv-gamebar__meta"><span class="bgv-gamebar__mi is-first">زنده</span><span class="bgv-gamebar__mi">۱۰ دقیقه + ۵ ثانیه</span><span class="bgv-gamebar__mi">حرکت ۱۱</span></span></div><button class="bgv-btn bgv-btn--icon bgv-btn--secondary bgv-iconbtn-count" type="button" aria-label="گفت‌وگوی میز"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" /></svg></button><button class="bgv-btn bgv-btn--icon bgv-btn--ghost" type="button" aria-label="گزینه‌های میز"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1" /> <circle cx="12" cy="5" r="1" /> <circle cx="12" cy="19" r="1" /></svg></button></header>

<main class="bgv-felt th-felt" style="padding:12px;gap:8px" aria-label="میز شطرنج">
 <div class="bgv-felt-row" style="justify-content:center"><span class="bgv-turn bgv-turn--mine" role="status"><span class="bgv-turn__who"><span class="bgv-avatar bgv-avatar--xs seat-1 is-you">م</span>نوبت شما، سفید</span></span></div>
 <div class="bgv-pcard bgv-pcard--wide th-duel" role="button" tabindex="0" aria-label="نیلوفر"><div class="bgv-pcard__top"><span class="bgv-avatar bgv-avatar--sm seat-2">ن</span><div class="bgv-pcard__name"><b><i class="bgv-seat seat-2"></i>نیلوفر<span class="bgv-league bgv-league--diamond">الماس</span></b><small>سیاه<span class="bgv-sep"></span>۱ پیاده گرفته</small></div><span class="bgv-clock" data-state="paused" style="--p:0.65;" role="timer" aria-label="ساعت نیلوفر، متوقف"><span class="bgv-clock__ring"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1" /> <rect x="6" y="4" width="4" height="16" rx="1" /></svg></span><span class="bgv-clock__time">۶:۳۰</span></span></div></div>
 <div class="th-stage" style="--ar:728/730;"><img src="../assets/games/tablehud-chess-board-m.webp" alt="صفحهٔ شطرنج از خود بازی؛ شما سفید پایین صفحه" width="364" height="365"></div>
 <div class="bgv-pcard bgv-pcard--wide th-duel is-you is-turn" style="--clock-c:var(--clock-warn)" role="button" tabindex="0" aria-label="مینا"><div class="bgv-pcard__top"><span class="bgv-avatar bgv-avatar--sm seat-1 is-you is-turn" style="--clock-c:var(--clock-warn);">م</span><div class="bgv-pcard__name"><b><i class="bgv-seat seat-1"></i>مینا<span class="bgv-league bgv-league--gold">طلا</span></b><small>سفید<span class="bgv-sep"></span>۲ پیاده گرفته، <span class="bgv-num--signed">+۱</span></small></div><span class="bgv-clock" data-state="warn" style="--p:0.42;" role="timer" aria-label="ساعت شما، در حال کم شدن"><span class="bgv-clock__ring"></span><span class="bgv-clock__time">۴:۱۲</span></span></div></div>
</main>
<section class="bgv-actiondock" aria-label="دست و کنش‌های شما"><div class="bgv-actiondock__prompt"><span style="min-inline-size:0">یک مهرهٔ خودی را بزنید<br><span style="font-size:13px;color:var(--text-muted);display:inline-flex;gap:6px;align-items:center"><svg class="bgv-icon bgv-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /> <path d="M3 3v5h5" /> <path d="M12 7v5l4 2" /></svg>آخرین حرکت سیاه <b class="bgv-latin" style="color:var(--text)">۱۰… axb4</b></span></span></div><div class="bgv-row" style="justify-content:space-between;gap:8px"><label class="bgv-check" style="font-size:14px"><input type="checkbox">همراه حرکتم پیشنهاد تساوی بده</label></div><div class="bgv-actiondock__actions"><button class="bgv-btn bgv-btn--icon bgv-btn--secondary" type="button" aria-label="همهٔ حرکت‌ها"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h.01" /> <path d="M3 18h.01" /> <path d="M3 6h.01" /> <path d="M8 12h13" /> <path d="M8 18h13" /> <path d="M8 6h13" /></svg></button><button class="bgv-btn bgv-btn--secondary" type="button"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m11 17 2 2a1 1 0 1 0 3-3" /> <path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4" /> <path d="m21 3 1 11h-2" /> <path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3" /> <path d="M3 4h8" /></svg>پیشنهاد تساوی</button><button class="bgv-btn bgv-btn--leave" type="button"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" /> <line x1="4" x2="4" y1="22" y2="15" /></svg>تسلیم</button></div></section>
</div>
</div>
</x-dc>
</body>
</html>
