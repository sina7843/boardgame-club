<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>تماشای میز، موبایل</title>
<link rel="stylesheet" href="../ds/bgv/tokens.css">
<link rel="stylesheet" href="../ds/bgv/components/bundle.css">
</head>
<body>
<x-dc>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&amp;family=Manrope:wght@600;800&amp;display=swap">
<style>
body{margin:0}
.ts-phone{position:relative;inline-size:390px;block-size:844px;overflow:hidden}
.ts-phone > .bgv-tablescreen{block-size:844px}
.ts-board{background:#1E2229}
.ts-board img{position:absolute;inset:0;display:block;inline-size:100%;block-size:100%;object-fit:contain}
.bgv-felt-plate .bgv-die{inline-size:28px;block-size:28px;border-radius:var(--radius-sm);font-size:15px}
.bgv-pcard--mini{align-content:start}
.bgv-pcard--mini .bgv-pcard__stats{justify-content:center;gap:8px}
.bgv-pcard--mini .bgv-pcard__foot{justify-content:center;min-block-size:24px}
.bgv-pcard--mini .bgv-pcard__name b{gap:4px}
.ts-phone .bgv-hud--strip{gap:6px}
.ts-phone .bgv-pcard--mini{padding:10px 6px 8px}
.ts-phone .bgv-pcard--mini .bgv-pcard__name b{gap:3px;overflow:visible}
.ts-phone .bgv-pcard--mini .bgv-seat{inline-size:13px;block-size:13px}
.ts-phone .bgv-pcard--mini.is-you .bgv-pcard__name b::after{padding-inline:5px}
.ts-phone .bgv-pcard--mini .bgv-pcard__score{display:flex;flex-direction:row;align-items:baseline;justify-content:center;gap:4px;white-space:nowrap}
.ts-resrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ts-res{display:grid;justify-items:center;gap:2px;padding:6px 4px;border-radius:var(--radius-md);background:var(--surface-sunken);font-size:12px;line-height:1.3;color:var(--text-muted);white-space:nowrap;min-inline-size:0}
.ts-res b{display:flex;align-items:center;gap:5px;font-size:16px;font-weight:900;color:var(--text)}
.ts-res i{inline-size:12px;block-size:12px;border-radius:var(--radius-xs);background:var(--_r);box-shadow:inset 0 0 0 1px rgba(20,33,27,.35)}
.ts-res.is-zero b{color:var(--text-muted)}
.ts-note{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:var(--radius-md);background:var(--felt-plate);box-shadow:inset 0 0 0 1px var(--felt-line);color:var(--felt-ink);font-size:13px;line-height:1.6}
.ts-note > .bgv-icon{flex:none;margin-block-start:2px;color:var(--clock-on-felt-critical)}
.ts-note b{display:block;font-size:14px}
.ts-note__body{flex:1;min-inline-size:0;display:grid;gap:4px}
.bgv-actiondock__prompt > span{min-inline-size:0}
.bgv-turn--mine .bgv-clock[data-state="stale"]{--clock-c:var(--on-invite)}
/* qa1: phone game bar, meta items must not be clipped mid-word */
@media (max-width:899px){.bgv-gamebar__meta{gap:4px}.bgv-gamebar__meta .bgv-sep{margin-inline:3px}}
</style>

<div class="bgv ts-phone" data-theme="light" dir="rtl"><div class="bgv-tablescreen"><header class="bgv-gamebar"><button class="bgv-btn bgv-btn--icon bgv-btn--ghost" type="button" aria-label="بازگشت به خانه"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /> <path d="m12 5 7 7-7 7" /></svg></button><div class="bgv-gamebar__title"><span class="bgv-gamebar__name">کاتان<span class="bgv-latin" style="font-size:12.5px;font-weight:600;color:var(--text-muted)">CATAN</span><span class="bgv-badge bgv-badge--info bgv-badge--sm"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /> <circle cx="12" cy="12" r="3" /></svg>تماشا</span></span><span class="bgv-gamebar__meta">زنده<span class="bgv-sep"></span>۶۰ ثانیه هر نوبت<span class="bgv-sep"></span><span style="display:inline-flex;align-items:center;gap:4px"><svg class="bgv-icon bgv-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /> <circle cx="12" cy="12" r="3" /></svg>۱۴</span></span></div><button class="bgv-btn bgv-btn--icon bgv-iconbtn-count" type="button" aria-label="گفت‌وگوی میز (فقط خواندنی)، ۱ پیام تازه"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" /></svg><span class="bgv-badge bgv-badge--count">۱</span></button><button class="bgv-btn bgv-btn--icon bgv-btn--ghost" type="button" aria-label="گزینه‌های میز"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1" /> <circle cx="12" cy="5" r="1" /> <circle cx="12" cy="19" r="1" /></svg></button></header><section class="bgv-hud bgv-hud--strip" aria-label="بازیکنان، برای جزئیات بزنید"><div class="bgv-pcard bgv-pcard--mini" role="button" tabindex="0" aria-label="مینا، ۲ امتیاز، جزئیات"><span class="bgv-avatar bgv-avatar--sm seat-3">م</span><div class="bgv-pcard__name"><b><i class="bgv-seat seat-3"></i>مینا</b></div><div class="bgv-pcard__score">۲<small>امتیاز</small></div><div class="bgv-pcard__stats"><span class="bgv-hstat" title="کارت منبع"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" /> <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" /> <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" /></svg>۳</span><span class="bgv-hstat" title="کارت توسعه"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2" /> <path d="M10 16c-1.1 0-2-.9-2-2v-4c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2" /> <rect width="8" height="8" x="14" y="14" rx="2" /></svg>۰</span></div><div class="bgv-pcard__foot"></div></div><div class="bgv-pcard bgv-pcard--mini" role="button" tabindex="0" aria-label="نیلوفر، ۲ امتیاز، جزئیات"><span class="bgv-avatar bgv-avatar--sm seat-1">ن</span><div class="bgv-pcard__name"><b><i class="bgv-seat seat-1"></i>نیلوفر</b></div><div class="bgv-pcard__score">۲<small>امتیاز</small></div><div class="bgv-pcard__stats"><span class="bgv-hstat" title="کارت منبع"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" /> <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" /> <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" /></svg>۲</span><span class="bgv-hstat" title="کارت توسعه"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2" /> <path d="M10 16c-1.1 0-2-.9-2-2v-4c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2" /> <rect width="8" height="8" x="14" y="14" rx="2" /></svg>۰</span></div><div class="bgv-pcard__foot"></div></div><div class="bgv-pcard bgv-pcard--mini" role="button" tabindex="0" aria-label="کاوه، ۲ امتیاز، جزئیات"><span class="bgv-avatar bgv-avatar--sm seat-4">ک</span><div class="bgv-pcard__name"><b><i class="bgv-seat seat-4"></i>کاوه</b></div><div class="bgv-pcard__score">۲<small>امتیاز</small></div><div class="bgv-pcard__stats"><span class="bgv-hstat" title="کارت منبع"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" /> <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" /> <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" /></svg>۲</span><span class="bgv-hstat" title="کارت توسعه"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2" /> <path d="M10 16c-1.1 0-2-.9-2-2v-4c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2" /> <rect width="8" height="8" x="14" y="14" rx="2" /></svg>۰</span></div><div class="bgv-pcard__foot"></div></div><div class="bgv-pcard bgv-pcard--mini is-turn" style="--clock-c:var(--clock-calm)" role="button" tabindex="0" aria-label="آرش، ۲ امتیاز، جزئیات"><span class="bgv-avatar bgv-avatar--sm seat-2">آ</span><div class="bgv-pcard__name"><b><i class="bgv-seat seat-2"></i>آرش</b></div><div class="bgv-pcard__score">۲<small>امتیاز</small></div><div class="bgv-pcard__stats"><span class="bgv-hstat" title="کارت منبع"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" /> <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" /> <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" /></svg>۱</span><span class="bgv-hstat" title="کارت توسعه"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2" /> <path d="M10 16c-1.1 0-2-.9-2-2v-4c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2" /> <rect width="8" height="8" x="14" y="14" rx="2" /></svg>۰</span></div><div class="bgv-pcard__foot"><span class="bgv-clock bgv-clock--chip" data-state="calm" style="--p:0.63" role="timer" aria-label="زمان نوبت آرش"><span class="bgv-clock__ring"></span><span class="bgv-clock__time">۰:۳۸</span></span></div></div></section><main class="bgv-felt" style="padding:12px;gap:10px" aria-label="میز کاتان"><div class="bgv-felt-row"><span class="bgv-turn" role="status"><span class="bgv-turn__who"><span class="bgv-avatar bgv-avatar--xs seat-2">آ</span>نوبت آرش</span><span class="bgv-turn__sep"></span><span class="bgv-clock" data-state="calm" style="--p:0.63" role="timer" aria-label="زمان نوبت آرش"><span class="bgv-clock__ring"></span><span class="bgv-clock__time">۰:۳۸</span></span></span><span class="bgv-felt-plate" aria-label="تاس آخر: ۵ و ۳، جمع ۸"><span class="bgv-die" aria-hidden="true">۵</span><span class="bgv-die" aria-hidden="true">۳</span><strong>۸</strong></span></div><div class="bgv-felt__board ts-board"><img src="../assets/games/tablestate-catan-opening.webp" alt="نقشهٔ جزیرهٔ کاتان پس از چیدمان آغازین: دو آبادی و دو جادهٔ هر بازیکن"></div></main><section class="bgv-actiondock" aria-label="گفت‌وگوی میز برای تماشاگر"><div class="bgv-actiondock__prompt" style="font-weight:400;font-size:14px;color:var(--text)"><span class="bgv-avatar bgv-avatar--xs seat-1">ن</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><b>نیلوفر:</b> آرش، سنگ نداری؟</span><span style="font-size:12px;color:var(--text-muted);flex:none">الان</span></div><div class="bgv-actiondock__actions" style="align-items:center"><span class="bgv-pstate" style="flex:1;font-size:13px;white-space:normal"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /> <circle cx="12" cy="12" r="3" /></svg>تماشاگرها گفت‌وگو را فقط می‌خوانند</span><button class="bgv-btn bgv-btn--leave" type="button" style="flex:none"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /> <polyline points="16 17 21 12 16 7" /> <line x1="21" x2="9" y1="12" y2="12" /></svg>ترک تماشا</button></div></section></div></div>
</x-dc>

</body>
</html>
