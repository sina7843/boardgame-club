<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>هانابی، همکاری، موبایل</title>
<link rel="stylesheet" href="../ds/bgv/tokens.css">
<link rel="stylesheet" href="../ds/bgv/components/bundle.css">
</head>
<body>
<x-dc>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&amp;family=Manrope:wght@600;800&amp;display=swap">
<style>
body{margin:0}
.th-stage{position:relative;flex:1;min-block-size:0}
.th-stage>img{position:absolute;inset:0;inline-size:100%;block-size:100%;object-fit:contain}
.th .bgv-pcard--mini{padding:10px 12px}
.th .bgv-pcard--mini .bgv-pcard__stats{gap:6px!important;flex-wrap:nowrap}
.th .bgv-pcard--mini>.bgv-avatar{margin-block:4px 9px}
.th .bgv-pcard--mini .bgv-pcard__score{flex-wrap:wrap;row-gap:0}
.th .bgv-pcard--mini.is-leader .bgv-pcard__score::before{flex-basis:100%;text-align:center}
.th .bgv-pcard__top>.bgv-avatar{margin:4px}
.th .bgv-felt-plate{padding:8px 12px}
.th .bgv-turn{max-inline-size:100%;min-inline-size:0}
.th .bgv-turn__who{min-inline-size:0;overflow:hidden;text-overflow:ellipsis}
.th-img{display:block;max-inline-size:100%;block-size:auto;object-fit:contain;margin-inline:auto}
.th-row{display:flex;align-items:center;gap:10px;min-inline-size:0}
.th-row>img{display:block;block-size:var(--h,48px);inline-size:auto;max-inline-size:62%;object-fit:contain;margin-inline-start:auto;flex:none}
.th-who{display:grid;gap:2px;min-inline-size:0;line-height:1.35}
.th-who b{display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap;flex:none}
.th-who small{font-size:12px;color:var(--felt-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-fpc{padding:8px 12px;gap:6px}
.th-hand{display:block;margin-inline:auto;max-inline-size:100%;object-fit:contain}
.th-tray{gap:8px;flex:none}
/* qa1: phone game bar, meta items must not be clipped mid-word */
@media (max-width:899px){.bgv-gamebar__meta{gap:4px}.bgv-gamebar__meta .bgv-sep{margin-inline:3px}}
</style>

<div class="bgv th" data-theme="light" dir="rtl" style="width: 390px; height: 844px; overflow: hidden; position: relative;">
<div class="bgv-tablescreen" style="height:844px">
<header class="bgv-gamebar"><button class="bgv-btn bgv-btn--icon bgv-btn--ghost" type="button" aria-label="بازگشت به میزها"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /> <path d="m12 5 7 7-7 7" /></svg></button><div class="bgv-gamebar__title"><span class="bgv-gamebar__name">هانابی<span class="bgv-latin" dir="ltr" style="font-size:12.5px;font-weight:600;color:var(--text-muted)">Hanabi</span></span><span class="bgv-gamebar__meta">زنده<span class="bgv-sep"></span>همکاری<span class="bgv-sep"></span>۶۰ ثانیه هر نوبت</span></div><button class="bgv-btn bgv-btn--icon bgv-btn--secondary bgv-iconbtn-count" type="button" aria-label="گفت‌وگوی میز"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" /></svg></button><button class="bgv-btn bgv-btn--icon bgv-btn--ghost" type="button" aria-label="گزینه‌های میز"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1" /> <circle cx="12" cy="5" r="1" /> <circle cx="12" cy="19" r="1" /></svg></button></header>
<section class="bgv-hud bgv-hud--strip" aria-label="هم‌تیمی‌ها؛ بازی همکاری است و امتیاز فردی ندارد"><div class="bgv-pcard bgv-pcard--mini is-you" role="button" tabindex="0" aria-label="مینا، برای جزئیات بزنید"><span class="bgv-avatar bgv-avatar--sm seat-1 is-you">م</span><div class="bgv-pcard__name"><b><i class="bgv-seat seat-1"></i><span class="bgv-sr">مینا</span></b></div><div class="bgv-pcard__foot"><span class="bgv-pstate bgv-pstate--wait"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 22h14" /> <path d="M5 2h14" /> <path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22" /> <path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2" /></svg>بعدی</span></div></div><div class="bgv-pcard bgv-pcard--mini" role="button" tabindex="0" aria-label="نیلوفر، برای جزئیات بزنید"><span class="bgv-avatar bgv-avatar--sm seat-2">ن</span><div class="bgv-pcard__name"><b><i class="bgv-seat seat-2"></i>نیلوفر</b></div><div class="bgv-pcard__foot"><span class="bgv-pstate"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>منتظر</span></div></div><div class="bgv-pcard bgv-pcard--mini" role="button" tabindex="0" aria-label="آرش، برای جزئیات بزنید"><span class="bgv-avatar bgv-avatar--sm seat-3">آ</span><div class="bgv-pcard__name"><b><i class="bgv-seat seat-3"></i>آرش</b></div><div class="bgv-pcard__foot"><span class="bgv-pstate"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>منتظر</span></div></div><div class="bgv-pcard bgv-pcard--mini is-turn" style="--clock-c:var(--clock-calm)" role="button" tabindex="0" aria-label="سارا، برای جزئیات بزنید"><span class="bgv-avatar bgv-avatar--sm seat-4 is-turn" style="--clock-c:var(--clock-calm);">س</span><div class="bgv-pcard__name"><b><i class="bgv-seat seat-4"></i>سارا</b></div></div></section>
<main class="bgv-felt th-felt" style="padding:12px;gap:8px" aria-label="میز هانابی">
 <div class="bgv-felt-row" style="flex-wrap:nowrap"><span class="bgv-turn" role="status"><span class="bgv-turn__who"><span class="bgv-avatar bgv-avatar--xs seat-4">س</span>نوبت سارا</span><span class="bgv-turn__sep"></span><span class="bgv-clock" data-state="calm" style="--p:0.63;"><span class="bgv-clock__ring"></span><span class="bgv-clock__time">۰:۳۸</span></span></span><span class="bgv-felt-plate"><svg class="bgv-icon bgv-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" /> <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" /> <path d="M4 22h16" /> <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" /> <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" /> <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" /></svg><strong>۱</strong> از ۲۵</span></div>
 <div class="th-stage" style="--ar:728/396;"><img src="../assets/games/tablehud-hanabi-sky.webp" alt="صفحهٔ مشترک تیم از خود بازی: ۸ ژتون سرنخ، ۱ فیوز سوخته، دسته ۳۱ کارت، آتش‌بازی قرمز ۱" width="364" height="198"></div>
 <div style="display:grid;gap:6px"><div class="bgv-felt-plate th-row" style="--h:46px;padding:6px 12px"><i class="bgv-seat seat-2"></i><b style="font-size:14px">نیلوفر</b><img src="../assets/games/tablehud-hanabi-hand-1.webp" alt="دست نیلوفر از خود بازی" width="192" height="66"></div><div class="bgv-felt-plate th-row" style="--h:46px;padding:6px 12px"><i class="bgv-seat seat-3"></i><b style="font-size:14px">آرش</b><img src="../assets/games/tablehud-hanabi-hand-2.webp" alt="دست آرش از خود بازی" width="192" height="65"></div><div class="bgv-felt-plate th-row" style="--h:46px;padding:6px 12px"><i class="bgv-seat seat-4"></i><b style="font-size:14px">سارا</b><img src="../assets/games/tablehud-hanabi-hand-3.webp" alt="دست سارا از خود بازی" width="192" height="65"></div></div>
</main>
<section class="bgv-actiondock is-waiting" aria-label="دست و کنش‌های شما"><div class="bgv-actiondock__prompt"><span style="min-inline-size:0">بعد از سارا نوبت شماست</span><span class="bgv-spacer"></span><span class="bgv-clock" data-state="paused" style="--p:1;"><span class="bgv-clock__ring"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1" /> <rect x="6" y="4" width="4" height="16" rx="1" /></svg></span><span class="bgv-clock__stack"><span class="bgv-clock__time">۱:۰۰</span><span class="bgv-clock__sub">زمان شما</span></span></span></div><img class="th-hand" src="../assets/games/tablehud-hanabi-me.webp" alt="دست شما: ۴ کارت که فقط پشتشان را می‌بینید" width="364" height="83" style="block-size:64px;inline-size:auto"><div class="bgv-actiondock__actions"><button class="bgv-btn bgv-btn--secondary" type="button" disabled="">سرنخ بده</button><button class="bgv-btn bgv-btn--secondary" type="button" disabled="">بازی</button><button class="bgv-btn bgv-btn--secondary" type="button" disabled="">دور انداختن</button></div></section>
</div>
</div>
</x-dc>

</body>
</html>
