<style>
body{margin:0}
.pf-h2{font-size:20px;font-weight:700;line-height:1.5;color:var(--heading);margin:0}
.pf-cap{font-size:13px;color:var(--text-muted)}
.pf-ul{list-style:none;margin:0;padding:0}
/* cosmetic frame drawn as a ring with a transparent gap, so seat / «شما» rings never touch it (bundle request) */
.bgv-frame.pf-fr{background:none;padding:var(--_fp,6px);flex:none;aspect-ratio:1/1;align-self:center;justify-self:center}
.bgv-frame.pf-fr::before{content:"";position:absolute;inset:0;border-radius:50%;padding:var(--_ft,3px);background:conic-gradient(from 210deg,var(--_f1),var(--_f2),var(--_f1));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.pf-fr--xs{--_fp:4px;--_ft:2px}.pf-fr--sm{--_fp:5px;--_ft:2.5px}.pf-fr--xl{--_fp:9px;--_ft:4px}.pf-fr--2xl{--_fp:11px;--_ft:5px}
.pf-fr.pf-ring{--_fp:11px}.pf-fr--xs.pf-ring{--_fp:8px}.pf-fr--sm.pf-ring{--_fp:10px}.pf-fr--xl.pf-ring{--_fp:15px}.pf-fr--2xl.pf-ring{--_fp:18px}
/* icons sit dead-centre in every tile and icon-only control */
.bgv-seg__item{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pf-tile{display:grid;place-items:center;flex:none}
.bgv-badge .bgv-icon,.bgv-chip .bgv-icon{flex:none}
.bgv-sticky-actions{position:absolute;inset-inline:0;inset-block-end:0;z-index:20}

.pf-cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.bgv-cosm{align-content:start;min-width:0;font:inherit;color:inherit}
.bgv-cosm__name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bgv-cosm.is-equipped::after{inset-block-start:18px;inset-inline-start:18px}
.pf-cmeta{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 6px;min-width:0;font-size:12px;color:var(--text-muted)}
.pf-ptile{display:grid;gap:8px}

.pf-scroll{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:16px;padding:16px 16px 96px}
.pf-scroll>*{flex:none}
.pf-cb4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pf-cb4 .bgv-cosm{padding:8px;gap:6px}
.pf-cb4 .bgv-cosm__name{font-size:12px}
.pf-cb4 .bgv-cosm.is-equipped::after{inset-block-start:12px;inset-inline-start:12px}

</style>
