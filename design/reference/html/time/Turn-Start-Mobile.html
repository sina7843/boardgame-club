<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>نوبت شماست</title>
<link rel="stylesheet" href="../ds/bgv/tokens.css">
<link rel="stylesheet" href="../ds/bgv/components/bundle.css">
</head>
<body>
<x-dc>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&amp;family=Manrope:wght@600;800&amp;display=swap">
<style>
body{margin:0}
.th-stage{position:relative;flex:1;min-block-size:0}
.th-stage>img{position:absolute;inset:0;inline-size:100%;block-size:100%;object-fit:contain}
.th .bgv-pcard--mini{padding:10px 12px}
.th .bgv-pcard--mini .bgv-pcard__stats{gap:6px!important;flex-wrap:nowrap}
.th .bgv-pcard--mini>.bgv-avatar{margin-block:4px 9px}
.th .bgv-pcard--mini .bgv-pcard__score{flex-wrap:wrap;row-gap:0}
.th .bgv-pcard--mini.is-leader .bgv-pcard__score::before{flex-basis:100%;text-align:center}
.th .bgv-pcard__top>.bgv-avatar{margin:4px}
.th .bgv-felt-plate{padding:8px 12px}
.th .bgv-turn{max-inline-size:100%;min-inline-size:0}
.th .bgv-turn__who{min-inline-size:0;overflow:hidden;text-overflow:ellipsis}
.th-img{display:block;max-inline-size:100%;block-size:auto;object-fit:contain;margin-inline:auto}
.th-pc6{padding:10px 12px;gap:4px}
.th-pc6 .bgv-pcard__foot{min-block-size:24px;gap:6px}
.th-pc6 .bgv-pcard__score{font-size:18px;display:flex;align-items:baseline;gap:3px}
.th-hand{display:block;margin-inline:auto;max-inline-size:100%;object-fit:contain}
.th-order{display:inline-flex;align-items:center;gap:6px}
/* qa1: phone game bar, meta items must not be clipped mid-word */
@media (max-width:899px){.bgv-gamebar__meta{gap:4px}.bgv-gamebar__meta .bgv-sep{margin-inline:3px}}
/* qa1: turn pill + plate share one felt row without clipping «نوبت …» or wrapping the plate */
.th .bgv-felt-row>.bgv-turn{flex:none;gap:8px;padding-inline:6px 12px}
.th .bgv-felt-row>.bgv-felt-plate{white-space:nowrap;padding-inline:10px;min-inline-size:0}

/*turn*/.toast-top{position:absolute;inset-inline:8px;inset-block-start:76px;z-index:20}
.toast-top .bgv-toast{inline-size:100%;max-inline-size:none;padding:12px 16px}
</style>

<div class="bgv th" data-theme="light" dir="rtl" style="width: 390px; height: 844px; overflow: hidden; position: relative;">
<div class="bgv-tablescreen" style="height:844px">
<header class="bgv-gamebar"><button class="bgv-btn bgv-btn--icon bgv-btn--ghost" type="button" aria-label="بازگشت به میزها"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /> <path d="m12 5 7 7-7 7" /></svg></button><div class="bgv-gamebar__title"><span class="bgv-gamebar__name">اونو<span class="bgv-latin" dir="ltr" style="font-size:12.5px;font-weight:600;color:var(--text-muted)">UNO</span></span><span class="bgv-gamebar__meta"><span class="bgv-gamebar__mi is-first">زنده</span><span class="bgv-gamebar__mi">۳۰ ثانیه هر نوبت</span><span class="bgv-gamebar__mi">دست ۱</span></span></div><button class="bgv-btn bgv-btn--icon bgv-btn--secondary bgv-iconbtn-count" type="button" aria-label="گفت‌وگوی میز، ۳ پیام تازه"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" /></svg><span class="bgv-badge bgv-badge--count">۳</span></button><button class="bgv-btn bgv-btn--leave bgv-btn--icon" type="button" aria-label="ترک میز"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /> <polyline points="16 17 21 12 16 7" /> <line x1="21" x2="9" y1="12" y2="12" /></svg></button><button class="bgv-btn bgv-btn--icon bgv-btn--ghost" type="button" aria-label="گزینه‌های میز"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1" /> <circle cx="12" cy="5" r="1" /> <circle cx="12" cy="19" r="1" /></svg></button></header>
<section class="bgv-hud bgv-hud--grid3" aria-label="بازیکنان به ترتیب نوبت، برای جزئیات بزنید"><div class="bgv-pcard th-pc6 is-you is-turn" style="--clock-c:var(--clock-calm)" role="button" tabindex="0" aria-label="مینا، ۶ کارت"><div class="bgv-pcard__name"><b><i class="bgv-seat seat-1"></i>مینا</b></div><div class="bgv-pcard__foot"><span class="bgv-pcard__score">۶<small>کارت</small></span><span class="bgv-spacer"></span></div></div><div class="bgv-pcard th-pc6" role="button" tabindex="0" aria-label="نیلوفر، ۳ کارت"><div class="bgv-pcard__name"><b><i class="bgv-seat seat-2"></i>نیلوفر</b></div><div class="bgv-pcard__foot"><span class="bgv-pcard__score">۳<small>کارت</small></span><span class="bgv-spacer"></span><span class="bgv-pstate"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 22h14" /> <path d="M5 2h14" /> <path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22" /> <path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2" /></svg>بعدی</span></div></div><div class="bgv-pcard th-pc6" role="button" tabindex="0" aria-label="آرش، ۳ کارت"><div class="bgv-pcard__name"><b><i class="bgv-seat seat-3"></i>آرش</b></div><div class="bgv-pcard__foot"><span class="bgv-pcard__score">۳<small>کارت</small></span><span class="bgv-spacer"></span><span class="bgv-hstat"><span class="bgv-strikes" aria-hidden="true"><i class="is-on"></i><i></i><i></i></span></span></div></div><div class="bgv-pcard th-pc6" role="button" tabindex="0" aria-label="سارا، ۴ کارت"><div class="bgv-pcard__name"><b><i class="bgv-seat seat-4"></i>سارا</b></div><div class="bgv-pcard__foot"><span class="bgv-pcard__score">۴<small>کارت</small></span><span class="bgv-spacer"></span><span class="bgv-hstat"><span class="bgv-strikes" aria-hidden="true"><i></i><i></i><i></i></span></span></div></div><div class="bgv-pcard th-pc6" role="button" tabindex="0" aria-label="کاوه، ۷ کارت"><div class="bgv-pcard__name"><b><i class="bgv-seat seat-5"></i>کاوه</b></div><div class="bgv-pcard__foot"><span class="bgv-pcard__score">۷<small>کارت</small></span><span class="bgv-spacer"></span><span class="bgv-hstat"><span class="bgv-strikes" aria-hidden="true"><i></i><i></i><i></i></span></span></div></div><div class="bgv-pcard th-pc6" role="button" tabindex="0" aria-label="رضا، ۳ کارت"><div class="bgv-pcard__name"><b><i class="bgv-seat seat-6"></i>رضا</b></div><div class="bgv-pcard__foot"><span class="bgv-pcard__score">۳<small>کارت</small></span><span class="bgv-spacer"></span><span class="bgv-pstate"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8V4H8" /> <rect width="16" height="12" x="4" y="8" rx="2" /> <path d="M2 14h2" /> <path d="M20 14h2" /> <path d="M15 13v2" /> <path d="M9 13v2" /></svg>ربات</span></div></div></section>
<main class="bgv-felt th-felt" style="padding:12px;gap:10px" aria-label="میز اونو">
 <div class="bgv-felt-row" style="flex-wrap:nowrap"><span class="bgv-turn bgv-turn--mine" role="status"><span class="bgv-turn__who"><span class="bgv-avatar bgv-avatar--xs seat-1 is-you">م</span>نوبت شما</span><span class="bgv-turn__sep"></span><span class="bgv-clock" data-state="calm" style="--p:1;"><span class="bgv-clock__ring"></span><span class="bgv-clock__time">۰:۳۰</span></span></span><span class="bgv-felt-plate th-order"><svg class="bgv-icon bgv-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /> <path d="M21 3v5h-5" /> <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /> <path d="M8 16H3v5" /></svg>جهت عادی</span></div>
 <div class="th-stage" style="--ar:728/442;"><img src="../assets/games/tablehud-uno-table-dk.webp" alt="دستهٔ کشیدن و کارت رو، از خود بازی؛ رنگ فعال زرد" width="364" height="221"></div>
 <span class="bgv-felt-plate" style="align-self:center"><i class="bgv-seat seat-6"></i><span><b>رضا</b> ۸ زرد گذاشت</span></span>
</main>
<section class="bgv-actiondock" aria-label="دست و کنش‌های شما"><div class="bgv-actiondock__prompt"><span style="min-inline-size:0">نوبت شماست: یک کارت هم‌رنگ، هم‌عدد یا هم‌نماد بگذارید</span><span class="bgv-spacer"></span><span class="bgv-clock" data-state="calm" style="--p:1;"><span class="bgv-clock__ring"></span><span class="bgv-clock__stack"><span class="bgv-clock__time">۰:۳۰</span><span class="bgv-clock__sub">زمان شما</span></span></span></div><img class="th-hand" src="../assets/games/tablehud-uno-hand-dk.webp" alt="دست شما: ۶ کارت؛ کارت‌های قابل بازی بالاتر نشسته‌اند" width="317" height="115" style="block-size:112px;inline-size:auto"><div class="bgv-actiondock__actions"><button class="bgv-btn bgv-btn--secondary" type="button"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" /> <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" /> <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" /></svg>کشیدن</button><button class="bgv-btn bgv-btn--secondary" type="button" disabled="">اونو!</button></div></section>
<div class="toast-top"><div class="bgv-toast bgv-toast--turn" role="status"><span class="bgv-toast__icon"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /> <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" /> <path d="M4 2C2.8 3.7 2 5.7 2 8" /> <path d="M22 8c0-2.3-.8-4.3-2-6" /></svg></span><span class="bgv-toast__body"><span class="bgv-toast__title">نوبت شماست</span><span class="bgv-toast__text">۳۰ ثانیه وقت دارید</span></span><span role="img" class="bgv-haptic" aria-label="صدای نوبت و لرزش کوتاه"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" /> <path d="M16 9a5 5 0 0 1 0 6" /> <path d="M19.364 18.364a9 9 0 0 0 0-12.728" /></svg><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m2 8 2 2-2 2 2 2-2 2" /> <path d="m22 8-2 2 2 2-2 2 2 2" /> <rect width="8" height="14" x="8" y="5" rx="1" /></svg></span></div></div></div>
</div>
