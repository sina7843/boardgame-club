<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>۴۰۴، موبایل</title>
<link rel="stylesheet" href="../ds/bgv/tokens.css">
<link rel="stylesheet" href="../ds/bgv/components/bundle.css">
</head>
<body>
<x-dc>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&amp;family=Manrope:wght@600;800&amp;display=swap">
<style>
body{margin:0}
.x-h2{font-size:20px;font-weight:700;line-height:1.5;color:var(--heading);margin:0}
.x-h3{font-size:17px;font-weight:700;line-height:1.5;color:var(--heading);margin:0}
.x-cap{font-size:13px;line-height:1.6;color:var(--text-muted)}
.x-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.x-between>*{min-width:0}
.x-stack{display:grid;gap:16px;min-width:0}
.x-sec{padding:0;display:grid;overflow:hidden}
.x-sec__head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.x-sec__head>h2{flex:1;min-width:0}
.x-sec__body{padding:20px;display:grid;gap:16px}
.x-tile{width:40px;height:40px;border-radius:var(--radius-md);display:grid;place-items:center;flex:none;background:var(--surface-raised);color:var(--heading);box-shadow:var(--shadow-tile)}
.x-row{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.x-row:last-child{border-bottom:0}
.x-row__text{flex:1 1 220px;min-width:0;display:grid;gap:2px;line-height:1.55}
.x-row__text b{font-size:15px;color:var(--text)}
.x-row__text span{font-size:13px;color:var(--text-muted)}
.x-row--stack{display:grid;gap:10px}
.x-li{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:60px;border-bottom:1px solid var(--line)}
.x-li:last-child{border-bottom:0}
.x-li__main{flex:1;min-width:0;display:grid;line-height:1.45}
.x-li__main>b{font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-li__main>span{font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-li__acts{display:flex;align-items:center;gap:6px;flex:none}
.bgv-btn .bgv-coin{font-weight:900}
.bgv-switch{gap:10px;flex:none}
.bgv-switch__state{min-width:3.2em;text-align:start;font-weight:700}
.bgv-switch[aria-checked="true"] .bgv-switch__track{background:var(--success)}
.bgv-switch[aria-checked="true"] .bgv-switch__track::after{background:var(--surface)}
.bgv-switch__track::before{border-color:var(--success)}
.x-phone{position:relative;overflow:hidden;display:flex;flex-direction:column}
.x-phone>.bgv-topbar{flex:none}
.x-pbody{flex:1;min-height:0;overflow:hidden;padding:16px 16px 104px;display:flex;flex-direction:column;gap:16px}
.x-pbody>*{flex-shrink:0}
.x-spec{padding:40px;display:flex;flex-direction:column;gap:32px;min-height:900px}
.x-spec__grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:32px 24px;align-items:stretch}
.x-frame{margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
.x-frame figcaption{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-muted);flex-wrap:wrap;padding-inline:4px}
.x-frame figcaption b{font-size:12.5px;font-weight:700;color:var(--label)}
.x-frame figcaption code{font-family:var(--font-latin);font-size:12px;color:var(--text-muted);margin-inline-start:auto}
.x-frame>.bgv-card{flex:1;min-height:260px;overflow:hidden}
.x-frame--wide{grid-column:span 2}
@media (max-width:760px){.x-frame--wide{grid-column:auto}.x-spec{padding:20px 16px}}
.x-statecard{display:grid;place-items:center;padding:0}
.x-statecard .bgv-state{padding:32px 24px 28px}
.x-tile404{width:60px;height:72px;border-radius:var(--radius-md);background:var(--surface);color:var(--heading);display:grid;place-items:center;font-size:42px;font-weight:900;box-shadow:var(--shadow-piece),inset 0 -4px 0 rgba(20,33,27,.18)}
.x-cover{width:64px;height:36px;border-radius:var(--radius-sm);object-fit:cover;flex:none}
</style>

<div class="bgv x-phone" data-theme="light" dir="rtl" style="width:390px;height:844px">
<header class="bgv-topbar"><a class="bgv-logo" href="/" aria-label="خانه"><img class="bgv-logo__light" src="../assets/symbol-primary-small.svg" alt="" style="block-size:32px"><img class="bgv-logo__dark" src="../assets/symbol-reversed-small.svg" alt="" style="block-size:32px"></a><span class="bgv-topbar__title">بردگیم‌ورس</span><a class="bgv-coinchip" href="/coins" aria-label="۲٬۴۸۰ سکه"><span class="bgv-coin bgv-coin--sm">۲٬۴۸۰</span></a><a class="bgv-btn bgv-btn--ghost bgv-btn--icon bgv-iconbtn-count" href="/notifications" aria-label="اعلان‌ها، ۵ خوانده‌نشده"><svg class="bgv-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /> <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" /></svg><span class="bgv-badge bgv-badge--count">۵</span></a></header>
<div class="x-pbody" style="justify-content:center;align-items:stretch;gap:20px;text-align:center">
 <div class="bgv-felt" style="height:190px;flex-direction:row;align-items:center;justify-content:center;gap:12px" aria-hidden="true">
  <span class="x-tile404" style="transform:rotate(-6deg)">۴</span><span class="x-tile404" style="transform:translateY(-8px)">۰</span><span class="x-tile404" style="transform:rotate(5deg)">۴</span>
  <i class="bgv-seat bgv-seat--lg seat-2" style="position:absolute;left:24px;bottom:22px"></i><i class="bgv-seat bgv-seat--lg seat-5" style="position:absolute;right:28px;top:24px"></i></div>
 <div style="display:grid;gap:6px"><h1 class="t-page-sm" style="color:var(--heading)">این صفحه پیدا نشد</h1><p class="t-body-sm bgv-muted" style="text-wrap:pretty">نشانی را بررسی کنید؛ شاید میزی که دنبالش هستید بسته شده.</p></div>
 <div style="display:grid;gap:8px"><a class="bgv-btn bgv-btn--primary bgv-btn--lg" href="#" style="width:100%"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" /> <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>بازگشت به خانه</a><a class="bgv-btn bgv-btn--secondary" href="#" style="width:100%"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8" /> <path d="m21 21-4.3-4.3" /></svg>جست‌وجوی بازی</a></div>
</div>
<nav class="bgv-dock" style="position:absolute;inset-inline:12px;inset-block-end:12px;z-index:5" aria-label="ناوبری">
<a class="bgv-dock__item" href="/"><svg class="bgv-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" /> <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>خانه</a>
<a class="bgv-dock__item" href="/games"><svg class="bgv-icon " viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1" /> <rect width="7" height="7" x="14" y="3" rx="1" /> <rect width="7" height="7" x="14" y="14" rx="1" /> <rect width="7" height="7" x="3" y="14" rx="1" /></svg>بازی‌ها</a>
<a class="bgv-dock__item" href="/tables"><svg class="bgv-icon " viewBox="0 0 24 24" aria-hidden="true"><rect width="12" height="12" x="2" y="10" rx="2" ry="2" /> <path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6" /> <path d="M6 18h.01" /> <path d="M10 14h.01" /> <path d="M15 6h.01" /> <path d="M18 9h.01" /></svg>میزها<span class="bgv-badge bgv-badge--count bgv-badge--count-invite">۳</span></a>
<a class="bgv-dock__item" href="/messages"><svg class="bgv-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" /></svg>پیام‌ها<span class="bgv-badge bgv-badge--count">۴</span></a>
<a class="bgv-dock__item" href="/more"><svg class="bgv-icon " viewBox="0 0 24 24" aria-hidden="true"><line x1="4" x2="20" y1="12" y2="12" /> <line x1="4" x2="20" y1="6" y2="6" /> <line x1="4" x2="20" y1="18" y2="18" /></svg>بیشتر</a></nav>
</div>
</x-dc>

</body>
</html>
