<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>تنظیمات، موبایل تیره</title>
<link rel="stylesheet" href="../ds/bgv/tokens.css">
<link rel="stylesheet" href="../ds/bgv/components/bundle.css">
</head>
<body>
<x-dc>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&amp;family=Manrope:wght@600;800&amp;display=swap">
<style>
body{margin:0}
.x-h2{font-size:20px;font-weight:700;line-height:1.5;color:var(--heading);margin:0}
.x-h3{font-size:17px;font-weight:700;line-height:1.5;color:var(--heading);margin:0}
.x-cap{font-size:13px;line-height:1.6;color:var(--text-muted)}
.x-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.x-between>*{min-width:0}
.x-stack{display:grid;gap:16px;min-width:0}
.x-sec{padding:0;display:grid;overflow:hidden}
.x-sec__head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.x-sec__head>h2{flex:1;min-width:0}
.x-sec__body{padding:20px;display:grid;gap:16px}
.x-tile{width:40px;height:40px;border-radius:var(--radius-md);display:grid;place-items:center;flex:none;background:var(--surface-raised);color:var(--heading);box-shadow:inset 0 0 0 1px var(--line),var(--shadow-tile)}
.x-row{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.x-row:last-child{border-bottom:0}
.x-row__text{flex:1 1 220px;min-width:0;display:grid;gap:2px;line-height:1.55}
.x-row__text b{font-size:15px;color:var(--text)}
.x-row__text span{font-size:13px;color:var(--text-muted)}
.x-row--stack{display:grid;gap:10px}
.x-li{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:60px;border-bottom:1px solid var(--line)}
.x-li:last-child{border-bottom:0}
.x-li__main{flex:1;min-width:0;display:grid;line-height:1.45}
.x-li__main>b{font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-li__main>span{font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-li__acts{display:flex;align-items:center;gap:6px;flex:none}
.bgv-btn .bgv-coin{font-weight:900}
.bgv-switch{gap:10px;flex:none}
.bgv-switch__state{min-width:3.2em;text-align:start;font-weight:700}



.x-phone{position:relative;overflow:hidden;display:flex;flex-direction:column}
.x-phone>.bgv-topbar{flex:none}
.x-pbody{flex:1;min-height:0;overflow:hidden;padding:16px 16px 104px;display:flex;flex-direction:column;gap:16px}
.x-pbody>*{flex-shrink:0}
.x-sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:20px;align-items:start}
.x-group{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--label);margin:0}
.x-group::after{content:"";flex:1;height:1px;background:var(--line)}
.x-theme{display:grid;gap:8px;cursor:pointer;font-size:14px;font-weight:700;text-align:center}
.x-theme__art{height:64px;border-radius:var(--radius-md);overflow:hidden;display:grid;grid-template-columns:1fr;grid-template-rows:9px;gap:5px;padding:6px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.x-theme__art i{display:block;border-radius:var(--radius-xs)}
.x-theme.is-selected .x-theme__art{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--heading)}
.x-legend{display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap;padding:14px 20px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--line)}
.x-legend__item{display:inline-flex;align-items:center;gap:10px;font-size:14px;color:var(--text)}
.x-legend .bgv-switch{pointer-events:none;min-height:0}
.x-danger{box-shadow:inset 0 0 0 1.5px var(--danger),var(--shadow-card)}
.x-row .bgv-seg{max-width:100%;overflow-x:auto}
.x-mli{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:56px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.x-mli:last-child{border-bottom:0}
.x-mli>.bgv-icon:first-child{color:var(--label)}
.x-mli__t{flex:1;min-width:0;font-size:15px;font-weight:700}
</style>

<div class="bgv x-phone" data-theme="dark" dir="rtl" style="width:390px;height:844px">
<header class="bgv-topbar"><a class="bgv-logo" href="/" aria-label="خانه"><img class="bgv-logo__light" src="../assets/symbol-primary-small.svg" alt="" style="block-size:32px"><img class="bgv-logo__dark" src="../assets/symbol-reversed-small.svg" alt="" style="block-size:32px"></a><span class="bgv-topbar__title">تنظیمات</span><a class="bgv-btn bgv-btn--ghost bgv-btn--icon" href="/search" aria-label="جست‌وجوی بازی"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8" /> <path d="m21 21-4.3-4.3" /></svg></a><a class="bgv-coinchip" href="/coins" aria-label="۲٬۴۸۰ سکه"><span class="bgv-coin bgv-coin--sm">۲٬۴۸۰</span></a><a class="bgv-btn bgv-btn--ghost bgv-btn--icon bgv-iconbtn-count" href="/notifications" aria-label="اعلان‌ها، ۵ خوانده‌نشده"><svg class="bgv-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /> <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" /></svg><span class="bgv-badge bgv-badge--count">۵</span></a></header>
<div class="x-pbody" style="padding-top:14px;gap:12px">
 <a href="#" class="bgv-card" style="padding:12px 16px;display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit"><div class="bgv-identity"><span class="bgv-frame bgv-frame--gold bgv-frame--tight"><span class="bgv-avatar">م</span></span><div class="bgv-identity__text"><span class="bgv-identity__name">مینا<span class="bgv-league bgv-league--gold">طلا</span></span><span class="bgv-identity__sub"><span class="bgv-identity__title">استاد معامله</span><span class="bgv-sep"></span>سطح ۱۸</span></div></div><span class="bgv-spacer"></span><span style="display:grid;place-items:center;width:24px;color:var(--text-muted)"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></span></a>
 <h2 class="x-group">حساب شما</h2>
 <div class="bgv-card bgv-card--flush">
  <a href="#" class="x-mli"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /> <path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg><span class="x-mli__t">حریم خصوصی</span><span class="x-cap">پیام: فقط دوستان</span><span style="display:grid;place-items:center;width:20px;color:var(--text-muted)"><svg class="bgv-icon bgv-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></span></a>
  <a href="#" class="x-mli"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /> <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" /></svg><span class="x-mli__t">اعلان‌ها</span><span class="x-cap">۵ از ۶ روشن</span><span style="display:grid;place-items:center;width:20px;color:var(--text-muted)"><svg class="bgv-icon bgv-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></span></a></div>
 <h2 class="x-group">این دستگاه</h2>
 <div class="bgv-card bgv-card--flush">
  <div class="x-mli" style="flex-wrap:wrap;padding-block:12px"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></svg><span class="x-mli__t">پوسته</span>
   <div class="bgv-seg bgv-seg--block" style="flex:1 1 100%" role="radiogroup" aria-label="پوسته"><button class="bgv-seg__item" role="radio" aria-checked="false">مطابق دستگاه</button><button class="bgv-seg__item" role="radio" aria-checked="false">روشن</button><button class="bgv-seg__item" role="radio" aria-checked="true">تیره</button></div></div>
  <a href="#" class="x-mli"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="10" x2="14" y1="2" y2="2" /> <line x1="12" x2="15" y1="14" y2="11" /> <circle cx="12" cy="14" r="8" /></svg><span class="x-mli__t">زمان انصراف حرکت</span><span class="x-cap">۱ ثانیه</span><span style="display:grid;place-items:center;width:20px;color:var(--text-muted)"><svg class="bgv-icon bgv-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></span></a>
  <div class="x-mli"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" /> <path d="M16 9a5 5 0 0 1 0 6" /> <path d="M19.364 18.364a9 9 0 0 0 0-12.728" /></svg><span class="x-mli__t">صداهای بازی</span><button class="bgv-switch" role="switch" aria-checked="true" aria-label="صداهای بازی"><span class="bgv-switch__track"></span><span class="bgv-switch__state">روشن</span></button></div>
  <div class="x-mli"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m2 8 2 2-2 2 2 2-2 2" /> <path d="m22 8-2 2 2 2-2 2 2 2" /> <rect width="8" height="14" x="8" y="5" rx="1" /></svg><span class="x-mli__t">لرزش</span><button class="bgv-switch" role="switch" aria-checked="false" aria-label="لرزش"><span class="bgv-switch__track"></span><span class="bgv-switch__state">خاموش</span></button></div></div>
 <button class="bgv-btn bgv-btn--leave" style="width:100%"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /> <polyline points="16 17 21 12 16 7" /> <line x1="21" x2="9" y1="12" y2="12" /></svg>خروج از حساب</button>
</div>
<nav class="bgv-dock bgv-dock--float" aria-label="بخش‌های اصلی"><a class="bgv-dock__item" href="/"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" /> <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg><span>خانه</span></a><a class="bgv-dock__item" href="/tables"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="12" height="12" x="2" y="10" rx="2" ry="2" /> <path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6" /> <path d="M6 18h.01" /> <path d="M10 14h.01" /> <path d="M15 6h.01" /> <path d="M18 9h.01" /></svg><span>میزها</span><span class="bgv-badge bgv-badge--count bgv-badge--count-invite" role="img" aria-label="۳ میز منتظر حرکت شما">۳</span></a><a class="bgv-dock__item" href="/messages"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" /></svg><span>پیام‌ها</span><span class="bgv-badge bgv-badge--count" role="img" aria-label="۴ تازه">۴</span></a><a class="bgv-dock__item is-active" href="/more" aria-current="page"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" x2="20" y1="12" y2="12" /> <line x1="4" x2="20" y1="6" y2="6" /> <line x1="4" x2="20" y1="18" y2="18" /></svg><span>بیشتر</span></a></nav>
</div>
</x-dc>
</body>
</html>
