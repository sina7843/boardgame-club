<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>ورود، نام و نماد</title><link rel="stylesheet" href="../../../system/tokens.css"><link rel="stylesheet" href="../../../system/components/bundle.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&amp;family=Manrope:wght@600;800&amp;display=swap">
<style>
body{margin:0}
.x-h2{font-size:20px;font-weight:700;line-height:1.5;color:var(--heading);margin:0}
.x-h3{font-size:17px;font-weight:700;line-height:1.5;color:var(--heading);margin:0}
.x-cap{font-size:13px;line-height:1.6;color:var(--text-muted)}
.x-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.x-between>*{min-width:0}
.x-stack{display:grid;gap:16px;min-width:0}
.x-sec{padding:0;display:grid;overflow:hidden}
.x-sec__head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.x-sec__head>h2{flex:1;min-width:0}
.x-sec__body{padding:20px;display:grid;gap:16px}
.x-tile{width:40px;height:40px;border-radius:var(--radius-md);display:grid;place-items:center;flex:none;background:var(--surface-raised);color:var(--heading);box-shadow:inset 0 0 0 1px var(--line),var(--shadow-tile)}
.x-row{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.x-row:last-child{border-bottom:0}
.x-row__text{flex:1 1 220px;min-width:0;display:grid;gap:2px;line-height:1.55}
.x-row__text b{font-size:15px;color:var(--text)}
.x-row__text span{font-size:13px;color:var(--text-muted)}
.x-row--stack{display:grid;gap:10px}
.x-li{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:60px;border-bottom:1px solid var(--line)}
.x-li:last-child{border-bottom:0}
.x-li__main{flex:1;min-width:0;display:grid;line-height:1.45}
.x-li__main>b{font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-li__main>span{font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-li__acts{display:flex;align-items:center;gap:6px;flex:none}
.bgv-btn .bgv-coin{font-weight:900}
.bgv-switch{gap:10px;flex:none}
.bgv-switch__state{min-width:3.2em;text-align:start;font-weight:700}



.x-phone{position:relative;overflow:hidden;display:flex;flex-direction:column}
.x-phone>.bgv-topbar{flex:none}
.x-pbody{flex:1;min-height:0;overflow:hidden;padding:16px 16px 104px;display:flex;flex-direction:column;gap:16px}
.x-pbody>*{flex-shrink:0}








.bgv-tel{min-height:52px}
.bgv-tel>input{font-size:20px;font-weight:700;color:var(--text);min-width:0}
.bgv-tel>span{gap:6px;display:flex;align-items:center}
.x-legal{font-size:12.5px;line-height:1.7;color:var(--text-muted);text-align:center;text-wrap:pretty}
.x-fan{position:relative;--fw:150px}
.x-fan img{position:absolute;left:50%;top:50%;width:var(--fw);height:calc(var(--fw) * .5625);object-fit:cover;border-radius:var(--radius-md);border:3px solid var(--felt-ink);box-shadow:var(--shadow-piece)}

/*ctx*/.x-ctx{display:flex;align-items:center;gap:8px;margin:0;padding:10px 12px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--line);background:var(--surface);font-size:13px;line-height:1.6;color:var(--text)}.x-ctx .bgv-icon{flex:none;color:var(--heading)}.x-close{position:absolute;inset-block-start:14px;inset-inline-start:12px}


</style>
</head><body style="margin:0">
<div class="bgv x-phone" data-theme="light" dir="rtl" style="width:390px;height:844px;position:relative"><a class="bgv-btn bgv-btn--ghost bgv-btn--icon" href="/" aria-label="بستن" style="position:absolute;inset-inline-end:8px;inset-block-start:8px;z-index:2"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></a>
<div style="display:flex;flex-direction:column;gap:16px;padding:52px 20px 20px;flex:1;min-height:0">
 <ol class="bgv-steps" aria-label="مراحل ورود"><li class="is-done"><b><svg class="bgv-icon bgv-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></b>شماره</li><li class="bgv-steps__bar is-done" aria-hidden="true"></li><li class="is-done"><b><svg class="bgv-icon bgv-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></b>کد تأیید</li><li class="bgv-steps__bar is-done" aria-hidden="true"></li><li class="is-cur" aria-current="step"><b>۳</b>پروفایل</li></ol>
 <div style="text-align:center;display:grid;gap:4px"><h1 class="t-page-sm" style="color:var(--heading)">خوش آمدید</h1>
  <p class="t-body-sm bgv-muted" style="text-wrap:pretty">یک نام و نماد انتخاب کنید؛ دیگران سر میز همین را می‌بینند.</p></div>
 <div class="bgv-field"><div class="x-between"><label class="bgv-label" for="dn">نام نمایشی</label><span class="x-cap bgv-num">۴ از ۲۴</span></div>
  <input class="bgv-input" id="dn" value="مینا" maxlength="24" aria-describedby="dn-h" style="font-size:17px;font-weight:700;border-color:var(--focus);border-width:2px">
  <span class="bgv-hint" id="dn-h">۲ تا ۲۴ حرف؛ اسم نامناسب را دیگران می‌توانند گزارش (report) کنند.</span></div>
 <fieldset style="border:0;margin:0;padding:0;display:grid;gap:12px"><legend class="bgv-label" style="margin-bottom:14px">نماد</legend>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px 8px;padding-top:6px"><label style="display:grid;justify-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:900;color:var(--heading)">
 <input type="radio" name="av" class="bgv-sr" checked="">
 <span style="position:relative;width:72px;height:72px;border-radius:50%;background:var(--success-soft);color:var(--heading);display:grid;place-items:center;box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--heading);"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:32px;height:32px;fill:currentColor"><path d="M12 2.5a3.2 3.2 0 0 1 3.2 3.2c0 .9-.3 1.6-.8 2.2 3 .4 7.1 1.7 7.1 3.7 0 1.3-1.7 1.7-3.7 1.5l2.1 6.4c.2.6-.2 1.1-.8 1.1h-4.1L12 16.2l-3 4.4H4.9c-.6 0-1-.5-.8-1.1l2.1-6.4c-2 .2-3.7-.2-3.7-1.5 0-2 4.1-3.3 7.1-3.7-.5-.6-.8-1.3-.8-2.2A3.2 3.2 0 0 1 12 2.5z"/></svg><span style="position:absolute;top:-6px;inset-inline-start:-6px;width:24px;height:24px;border-radius:50%;background:var(--heading);color:var(--surface);display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)"><svg class="bgv-icon bgv-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></span></span>آدمک</label><label style="display:grid;justify-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:400;color:var(--text-muted)">
 <input type="radio" name="av" class="bgv-sr">
 <span style="position:relative;width:72px;height:72px;border-radius:50%;background:var(--info-soft);color:var(--heading);display:grid;place-items:center;"><img src="../../assets/symbols/dice.webp" alt="" width="44" height="44" style="display:block;inline-size:44px;block-size:44px"></span>تاس</label><label style="display:grid;justify-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:400;color:var(--text-muted)">
 <input type="radio" name="av" class="bgv-sr">
 <span style="position:relative;width:72px;height:72px;border-radius:50%;background:var(--warning-soft);color:var(--heading);display:grid;place-items:center;"><img src="../../assets/symbols/crown.webp" alt="" width="44" height="44" style="display:block;inline-size:44px;block-size:44px"></span>تاج</label><label style="display:grid;justify-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:400;color:var(--text-muted)">
 <input type="radio" name="av" class="bgv-sr">
 <span style="position:relative;width:72px;height:72px;border-radius:50%;background:#FFFFFF;box-shadow:inset 0 0 0 1px #D8D0C4;color:var(--heading);display:grid;place-items:center;"><img src="../../assets/symbols/pawn.webp" alt="" width="44" height="44" style="display:block;inline-size:44px;block-size:44px"></span>مهره</label><label style="display:grid;justify-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:400;color:var(--text-muted)">
 <input type="radio" name="av" class="bgv-sr">
 <span style="position:relative;width:72px;height:72px;border-radius:50%;background:#F1ECE4;box-shadow:inset 0 0 0 1px #D8D0C4;color:var(--heading);display:grid;place-items:center;"><img src="../../assets/symbols/card.webp" alt="" width="44" height="44" style="display:block;inline-size:44px;block-size:44px"></span>کارت</label><label style="display:grid;justify-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:400;color:var(--text-muted)">
 <input type="radio" name="av" class="bgv-sr">
 <span style="position:relative;width:72px;height:72px;border-radius:50%;background:var(--danger-soft);color:var(--heading);display:grid;place-items:center;"><img src="../../assets/symbols/star.webp" alt="" width="44" height="44" style="display:block;inline-size:44px;block-size:44px"></span>ستاره</label></div></fieldset>
 <p class="x-legal">بعداً می‌توانید در پروفایل آواتار خودتان را بسازید.</p>
 <span class="bgv-spacer"></span>
<p class="x-ctx"><svg class="bgv-icon bgv-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 17 4 12 9 7" /> <path d="M20 18v-2a4 4 0 0 0-4-4H4" /></svg><span>بعد از ورود به همان صفحه‌ای برمی‌گردید که بودید.</span></p>
 <button class="bgv-btn bgv-btn--primary bgv-btn--lg bgv-btn--block" type="submit">ذخیره و ادامه</button>
</div>
</div>
</body></html>
