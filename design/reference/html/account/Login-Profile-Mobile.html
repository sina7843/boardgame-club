<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>ورود، نام و نماد</title>
<link rel="stylesheet" href="../ds/bgv/tokens.css">
<link rel="stylesheet" href="../ds/bgv/components/bundle.css">
</head>
<body>
<x-dc>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&amp;family=Manrope:wght@600;800&amp;display=swap">
<style>
body{margin:0}
.x-h2{font-size:20px;font-weight:700;line-height:1.5;color:var(--heading);margin:0}
.x-h3{font-size:17px;font-weight:700;line-height:1.5;color:var(--heading);margin:0}
.x-cap{font-size:13px;line-height:1.6;color:var(--text-muted)}
.x-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.x-between>*{min-width:0}
.x-stack{display:grid;gap:16px;min-width:0}
.x-sec{padding:0;display:grid;overflow:hidden}
.x-sec__head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.x-sec__head>h2{flex:1;min-width:0}
.x-sec__body{padding:20px;display:grid;gap:16px}
.x-tile{width:40px;height:40px;border-radius:var(--radius-md);display:grid;place-items:center;flex:none;background:var(--surface-raised);color:var(--heading);box-shadow:var(--shadow-tile)}
.x-row{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.x-row:last-child{border-bottom:0}
.x-row__text{flex:1 1 220px;min-width:0;display:grid;gap:2px;line-height:1.55}
.x-row__text b{font-size:15px;color:var(--text)}
.x-row__text span{font-size:13px;color:var(--text-muted)}
.x-row--stack{display:grid;gap:10px}
.x-li{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:60px;border-bottom:1px solid var(--line)}
.x-li:last-child{border-bottom:0}
.x-li__main{flex:1;min-width:0;display:grid;line-height:1.45}
.x-li__main>b{font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-li__main>span{font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-li__acts{display:flex;align-items:center;gap:6px;flex:none}
.bgv-btn .bgv-coin{font-weight:900}
.bgv-switch{gap:10px;flex:none}
.bgv-switch__state{min-width:3.2em;text-align:start;font-weight:700}
.bgv-switch[aria-checked="true"] .bgv-switch__track{background:var(--success)}
.bgv-switch[aria-checked="true"] .bgv-switch__track::after{background:var(--surface)}
.bgv-switch__track::before{border-color:var(--success)}
.x-phone{position:relative;overflow:hidden;display:flex;flex-direction:column}
.x-phone>.bgv-topbar{flex:none}
.x-pbody{flex:1;min-height:0;overflow:hidden;padding:16px 16px 104px;display:flex;flex-direction:column;gap:16px}
.x-pbody>*{flex-shrink:0}
.x-steps{display:flex;align-items:center;justify-content:center;gap:8px;margin:0;padding:0;list-style:none;font-size:13px;line-height:1;flex-wrap:wrap}
.x-steps li{display:flex;align-items:center;gap:8px;color:var(--text-muted);white-space:nowrap}
.x-steps b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;background:var(--surface-sunken);box-shadow:var(--shadow-field)}
.x-steps .is-done b{background:var(--primary);color:var(--on-primary);box-shadow:none}
.x-steps .is-cur{color:var(--text);font-weight:700}
.x-steps .is-cur b{background:var(--surface);color:var(--heading);box-shadow:0 0 0 2px var(--primary)}
.x-steps .x-bar{width:20px;height:2px;border-radius:2px;background:var(--line)}
.x-steps .x-bar.is-done{background:var(--primary)}
.bgv-tel{min-height:52px}
.bgv-tel>input{font-size:20px;font-weight:700;color:var(--text);min-width:0}
.bgv-tel>span{gap:6px;display:flex;align-items:center}
.x-legal{font-size:12.5px;line-height:1.7;color:var(--text-muted);text-align:center;text-wrap:pretty}
.x-fan{position:relative;--fw:150px}
.x-fan img{position:absolute;left:50%;top:50%;width:var(--fw);height:calc(var(--fw) * .5625);object-fit:cover;border-radius:var(--radius-md);border:3px solid var(--felt-ink);box-shadow:var(--shadow-piece)}
</style>

<div class="bgv x-phone" data-theme="light" dir="rtl" style="width:390px;height:844px">
<div style="display:flex;flex-direction:column;gap:20px;padding:24px 20px;flex:1;min-height:0">
 <ol class="x-steps" aria-label="مراحل ورود"><li class="is-done"><b><svg class="bgv-icon bgv-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></b>شماره</li><li class="x-bar is-done" aria-hidden="true"></li><li class="is-done"><b><svg class="bgv-icon bgv-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></b>کد تأیید</li><li class="x-bar is-done" aria-hidden="true"></li><li class="is-cur" aria-current="step"><b>۳</b>پروفایل</li></ol>
 <div style="text-align:center;display:grid;gap:4px"><h1 class="t-page-sm" style="color:var(--heading)">خوش آمدید</h1>
  <p class="t-body-sm bgv-muted" style="text-wrap:pretty">نامی که دیگران سر میز می‌بینند و نماد خود را انتخاب کنید.</p></div>
 <div class="bgv-field"><div class="x-between"><label class="bgv-label" for="dn">نام نمایشی</label><span class="x-cap bgv-num">۴ از ۲۴</span></div>
  <input class="bgv-input" id="dn" value="مینا" maxlength="24" aria-describedby="dn-h" style="font-size:17px;font-weight:700;border-color:var(--focus);border-width:2px">
  <span class="bgv-hint" id="dn-h">۲ تا ۲۴ نویسه؛ نام نمایشی قابل گزارش است.</span></div>
 <fieldset style="border:0;margin:0;padding:0;display:grid;gap:12px"><legend class="bgv-label" style="margin-bottom:14px">نماد</legend>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px 8px;padding-top:6px"><label style="display:grid;justify-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:900;color:var(--heading)">
 <input type="radio" name="av" class="bgv-sr" checked="">
 <span style="position:relative;width:72px;height:72px;border-radius:50%;background:var(--success-soft);color:var(--heading);display:grid;place-items:center;box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--primary);"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:32px;height:32px;fill:currentColor"><path d="M12 2.5a3.2 3.2 0 0 1 3.2 3.2c0 .9-.3 1.6-.8 2.2 3 .4 7.1 1.7 7.1 3.7 0 1.3-1.7 1.7-3.7 1.5l2.1 6.4c.2.6-.2 1.1-.8 1.1h-4.1L12 16.2l-3 4.4H4.9c-.6 0-1-.5-.8-1.1l2.1-6.4c-2 .2-3.7-.2-3.7-1.5 0-2 4.1-3.3 7.1-3.7-.5-.6-.8-1.3-.8-2.2A3.2 3.2 0 0 1 12 2.5z"/></svg><span style="position:absolute;top:-6px;inset-inline-start:-6px;width:24px;height:24px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)"><svg class="bgv-icon bgv-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></span></span>آدمک</label><label style="display:grid;justify-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:400;color:var(--text-muted)">
 <input type="radio" name="av" class="bgv-sr">
 <span style="position:relative;width:72px;height:72px;border-radius:50%;background:var(--info-soft);color:var(--heading);display:grid;place-items:center;"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true" style="width:30px;height:30px"><rect width="18" height="18" x="3" y="3" rx="2" ry="2" /> <path d="M16 8h.01" /> <path d="M8 8h.01" /> <path d="M8 16h.01" /> <path d="M16 16h.01" /> <path d="M12 12h.01" /></svg></span>تاس</label><label style="display:grid;justify-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:400;color:var(--text-muted)">
 <input type="radio" name="av" class="bgv-sr">
 <span style="position:relative;width:72px;height:72px;border-radius:50%;background:var(--warning-soft);color:var(--heading);display:grid;place-items:center;"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true" style="width:30px;height:30px"><path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z" /> <path d="M5 21h14" /></svg></span>تاج</label><label style="display:grid;justify-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:400;color:var(--text-muted)">
 <input type="radio" name="av" class="bgv-sr">
 <span style="position:relative;width:72px;height:72px;border-radius:50%;background:var(--invite-soft);color:var(--heading);display:grid;place-items:center;"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:32px;height:32px;fill:currentColor"><path d="M12 2a3.4 3.4 0 0 0-2 6.2L8.6 9.6h6.8L14 8.2A3.4 3.4 0 0 0 12 2zM9.4 10.8c0 2.8-1.1 5.4-2.8 7.4h10.8c-1.7-2-2.8-4.6-2.8-7.4zM5.5 19.4h13a1 1 0 0 1 1 1V22h-15v-1.6a1 1 0 0 1 1-1z"/></svg></span>مهره</label><label style="display:grid;justify-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:400;color:var(--text-muted)">
 <input type="radio" name="av" class="bgv-sr">
 <span style="position:relative;width:72px;height:72px;border-radius:50%;background:var(--surface-raised);color:var(--heading);display:grid;place-items:center;"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true" style="width:30px;height:30px"><path d="M4 10c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2" /> <path d="M10 16c-1.1 0-2-.9-2-2v-4c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2" /> <rect width="8" height="8" x="14" y="14" rx="2" /></svg></span>کارت</label><label style="display:grid;justify-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:400;color:var(--text-muted)">
 <input type="radio" name="av" class="bgv-sr">
 <span style="position:relative;width:72px;height:72px;border-radius:50%;background:var(--danger-soft);color:var(--heading);display:grid;place-items:center;"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true" style="width:30px;height:30px"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z" /></svg></span>ستاره</label></div></fieldset>
 <p class="x-legal">بعداً در پروفایل، آواتار ۱۱ لایه‌ای خودتان را می‌سازید.</p>
 <span class="bgv-spacer"></span>
 <button class="bgv-btn bgv-btn--primary bgv-btn--lg bgv-btn--block" type="submit">ذخیره و ادامه</button>
</div>
</div>
</x-dc>

</body>
</html>
