<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>دوستان</title>
<link rel="stylesheet" href="../ds/bgv/tokens.css">
<link rel="stylesheet" href="../ds/bgv/components/bundle.css">
</head>
<body>
<x-dc>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&amp;family=Manrope:wght@600;800&amp;display=swap">
<style>
body{margin:0}
.x-h2{font-size:20px;font-weight:700;line-height:1.5;color:var(--heading);margin:0}
.x-h3{font-size:17px;font-weight:700;line-height:1.5;color:var(--heading);margin:0}
.x-cap{font-size:13px;line-height:1.6;color:var(--text-muted)}
.x-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.x-between>*{min-width:0}
.x-stack{display:grid;gap:16px;min-width:0}
.x-sec{padding:0;display:grid;overflow:hidden}
.x-sec__head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.x-sec__head>h2{flex:1;min-width:0}
.x-sec__body{padding:20px;display:grid;gap:16px}
.x-tile{width:40px;height:40px;border-radius:var(--radius-md);display:grid;place-items:center;flex:none;background:var(--surface-raised);color:var(--heading);box-shadow:inset 0 0 0 1px var(--line),var(--shadow-tile)}
.x-row{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.x-row:last-child{border-bottom:0}
.x-row__text{flex:1 1 220px;min-width:0;display:grid;gap:2px;line-height:1.55}
.x-row__text b{font-size:15px;color:var(--text)}
.x-row__text span{font-size:13px;color:var(--text-muted)}
.x-row--stack{display:grid;gap:10px}
.x-li{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:60px;border-bottom:1px solid var(--line)}
.x-li:last-child{border-bottom:0}
.x-li__main{flex:1;min-width:0;display:grid;line-height:1.45}
.x-li__main>b{font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-li__main>span{font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-li__acts{display:flex;align-items:center;gap:6px;flex:none}
.bgv-btn .bgv-coin{font-weight:900}
.bgv-switch{gap:10px;flex:none}
.bgv-switch__state{min-width:3.2em;text-align:start;font-weight:700}



.x-phone{position:relative;overflow:hidden;display:flex;flex-direction:column}
.x-phone>.bgv-topbar{flex:none}
.x-pbody{flex:1;min-height:0;overflow:hidden;padding:16px 16px 104px;display:flex;flex-direction:column;gap:16px}
.x-pbody>*{flex-shrink:0}
.x-fr{flex-wrap:wrap;padding-inline:20px;row-gap:10px}
.x-fr .x-li__main{flex:1 1 220px}
.x-fr .x-li__acts{margin-inline-start:auto}
.x-grp{font-size:12.5px;font-weight:700;color:var(--label);padding:12px 20px 6px;border-bottom:1px solid var(--line);background:transparent}
.x-toolbar{display:flex;align-items:center;gap:12px;padding:16px 20px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.x-toolbar .bgv-affix{flex:1 1 240px;min-width:0}
.bgv-chat__head{padding-inline:16px 12px;gap:10px}
.bgv-chat__list{padding:16px}
.bgv-composer{padding:12px 16px}
.x-crest{display:grid;place-items:center;flex:none;font-weight:900;color:var(--surface);background:var(--heading);border-radius:50%;box-shadow:0 0 0 4px var(--surface),var(--shadow-tile)}
.x-mosaic{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px;width:80px;height:80px;flex:none;border-radius:var(--radius-lg);background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--line),var(--shadow-tile)}
.x-mosaic .bgv-avatar{--_s:31px;box-shadow:none}
.x-head{display:flex;align-items:center;gap:20px;padding:20px 24px;flex-wrap:wrap}
.x-head__text{flex:1 1 280px;display:grid;gap:6px;min-width:0}
.x-clubcard{display:flex;flex-direction:column}
.x-clubcard__body{padding:0 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.x-clubcard__foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.x-desc{font-size:14px;line-height:1.75;color:var(--text);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:3.5em}
@media (max-width:899px){.x-head{padding:16px}.x-chatbox{height:520px!important}}
.x-pbody .bgv-tab{padding-inline:0;font-size:14px}
</style>

<div class="bgv x-phone" data-theme="light" dir="rtl" style="width:390px;height:844px">
<header class="bgv-topbar"><a class="bgv-logo" href="/" aria-label="خانه"><img class="bgv-logo__light" src="../assets/symbol-primary-small.svg" alt="" style="block-size:32px"><img class="bgv-logo__dark" src="../assets/symbol-reversed-small.svg" alt="" style="block-size:32px"></a><span class="bgv-topbar__title">پیام‌ها و دوستان</span><a class="bgv-btn bgv-btn--ghost bgv-btn--icon" href="/search" aria-label="جست‌وجوی بازی"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8" /> <path d="m21 21-4.3-4.3" /></svg></a><a class="bgv-coinchip" href="/coins" aria-label="۲٬۴۸۰ سکه"><span class="bgv-coin bgv-coin--sm">۲٬۴۸۰</span></a><a class="bgv-btn bgv-btn--ghost bgv-btn--icon bgv-iconbtn-count" href="/notifications" aria-label="اعلان‌ها، ۵ خوانده‌نشده"><svg class="bgv-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /> <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" /></svg><span class="bgv-badge bgv-badge--count">۵</span></a></header>
<div class="x-pbody" style="gap:14px;padding-top:12px">
 <nav class="bgv-pagetabs" aria-label="پیام‌ها و دوستان"><a href="/messages">پیام‌ها ۴</a><a href="/friends" class="is-active" aria-current="page">دوستان ۲۴</a><a href="/clubs">باشگاه‌ها</a></nav>
 <div class="bgv-tabs" role="tablist" style="gap:12px"><button class="bgv-tab is-active" role="tab" aria-selected="true">دوستان (۲۴)</button><button class="bgv-tab" role="tab" aria-selected="false" style="display:inline-flex;gap:6px;align-items:center">درخواست‌ها<span class="bgv-badge bgv-badge--count">۳</span></button><button class="bgv-tab" role="tab" aria-selected="false">یافتن</button><button class="bgv-tab" role="tab" aria-selected="false">مسدود و بی‌صدا</button></div>
 <a href="#" class="bgv-card" style="padding:12px 16px;display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit">
  <span class="bgv-avatars"><span class="bgv-avatar bgv-avatar--sm" style="background:var(--danger-soft)">ی</span><span class="bgv-avatar bgv-avatar--sm" style="background:var(--success-soft)">د</span><span class="bgv-avatar bgv-avatar--sm" style="background:var(--warning-soft)">ل</span></span>
  <span style="flex:1;display:grid;line-height:1.45;min-width:0"><b style="font-size:15px">۳ درخواست دوستی</b><span class="x-cap">یاسمن، دانیال و لیلا</span></span><span style="display:grid;place-items:center;width:24px"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></span></a>
 <div class="bgv-affix"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8" /> <path d="m21 21-4.3-4.3" /></svg><input class="bgv-input" type="search" placeholder="جست‌وجو در دوستان" aria-label="جست‌وجو در دوستان"></div>
 <section class="bgv-card bgv-card--flush"><div class="x-grp" style="padding-inline:16px">آنلاین، ۶</div><div class="x-li" style="padding-inline:16px"><span class="bgv-avatar" style="background:var(--info-soft)">ن<span class="bgv-avatar__status"></span></span><div class="x-li__main"><b>نیلوفر<span class="bgv-league bgv-league--diamond">الماس</span></b><span style="color:var(--success)">آنلاین، در لابی</span></div><div class="x-li__acts"><button class="bgv-btn bgv-btn--icon bgv-btn--secondary" aria-label="دعوت نیلوفر به میز"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v3" /> <path d="M3 16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5a2 2 0 0 0-4 0v1.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V11a2 2 0 0 0-4 0z" /> <path d="M5 18v2" /> <path d="M19 18v2" /></svg></button></div></div><div class="x-li" style="padding-inline:16px"><span class="bgv-avatar" style="background:var(--warning-soft)">آ<span class="bgv-avatar__status"></span></span><div class="x-li__main"><b>آرش<span class="bgv-league bgv-league--platinum">پلاتین</span></b><span style="color:var(--text-muted)"><svg class="bgv-icon bgv-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><rect width="12" height="12" x="2" y="10" rx="2" ry="2" /> <path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6" /> <path d="M6 18h.01" /> <path d="M10 14h.01" /> <path d="M15 6h.01" /> <path d="M18 9h.01" /></svg>در حال بازی کاتان، رتبه‌دار</span></div><div class="x-li__acts"><button class="bgv-btn bgv-btn--icon bgv-btn--secondary" aria-label="تماشای بازی آرش"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /> <circle cx="12" cy="12" r="3" /></svg></button></div></div><div class="x-li" style="padding-inline:16px"><span class="bgv-avatar" style="background:var(--danger-soft)">س<span class="bgv-avatar__status"></span></span><div class="x-li__main"><b>سارا<span class="bgv-league bgv-league--gold">طلا</span></b><span style="color:var(--success)">آنلاین</span></div><div class="x-li__acts"><span class="bgv-badge bgv-badge--you"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>دعوت شد</span></div></div><div class="x-li" style="padding-inline:16px"><span class="bgv-avatar" style="background:var(--success-soft)">ک<span class="bgv-avatar__status"></span></span><div class="x-li__main"><b>کاوه<span class="bgv-league bgv-league--silver">نقره</span></b><span style="color:var(--text-muted)"><svg class="bgv-icon bgv-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><rect width="12" height="12" x="2" y="10" rx="2" ry="2" /> <path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6" /> <path d="M6 18h.01" /> <path d="M10 14h.01" /> <path d="M15 6h.01" /> <path d="M18 9h.01" /></svg>در حال بازی شطرنج، زنده</span></div><div class="x-li__acts"><button class="bgv-btn bgv-btn--icon bgv-btn--secondary" aria-label="تماشای بازی کاوه"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /> <circle cx="12" cy="12" r="3" /></svg></button></div></div><div class="x-li" style="padding-inline:16px"><span class="bgv-avatar" >پ<span class="bgv-avatar__status"></span></span><div class="x-li__main"><b>پریسا<span class="bgv-league bgv-league--gold">طلا</span></b><span style="color:var(--success)">آنلاین</span></div><div class="x-li__acts"><button class="bgv-btn bgv-btn--icon bgv-btn--secondary" aria-label="دعوت پریسا به میز"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v3" /> <path d="M3 16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5a2 2 0 0 0-4 0v1.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V11a2 2 0 0 0-4 0z" /> <path d="M5 18v2" /> <path d="M19 18v2" /></svg></button></div></div></section>
</div>
<nav class="bgv-dock bgv-dock--float" aria-label="بخش‌های اصلی"><a class="bgv-dock__item" href="/"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" /> <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg><span>خانه</span></a><a class="bgv-dock__item" href="/tables"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="12" height="12" x="2" y="10" rx="2" ry="2" /> <path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6" /> <path d="M6 18h.01" /> <path d="M10 14h.01" /> <path d="M15 6h.01" /> <path d="M18 9h.01" /></svg><span>میزها</span><span class="bgv-badge bgv-badge--count bgv-badge--count-invite" role="img" aria-label="۳ میز منتظر حرکت شما">۳</span></a><a class="bgv-dock__item is-active" href="/messages" aria-current="page"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" /></svg><span>پیام‌ها</span><span class="bgv-badge bgv-badge--count" role="img" aria-label="۴ تازه">۴</span></a><a class="bgv-dock__item" href="/more"><svg class="bgv-icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" x2="20" y1="12" y2="12" /> <line x1="4" x2="20" y1="6" y2="6" /> <line x1="4" x2="20" y1="18" y2="18" /></svg><span>بیشتر</span></a></nav>
</div>
</x-dc>
</body>
</html>
