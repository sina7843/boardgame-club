<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>بردگیم‌ورس</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; block-size: 100%; background: #142B3B; color: #F6F0E4; font-family: system-ui, sans-serif; }
    main { min-block-size: 100%; display: grid; place-content: center; gap: 16px; padding: 24px; text-align: center; box-sizing: border-box; }
    h1 { font-size: 22px; margin: 0; }
    p { margin: 0; opacity: .85; line-height: 1.8; }
    button { justify-self: center; font: inherit; font-weight: 700; padding: 12px 28px; border: 0; border-radius: 12px; background: #F6F0E4; color: #142B3B; }
  </style>
</head>
<body>
  <!-- Shown by Capacitor (server.errorPath) when the live site cannot load. -->
  <main>
    <h1>اتصال به اینترنت برقرار نیست</h1>
    <p>بردگیم‌ورس بازی آنلاین است و برای اجرا به اینترنت نیاز دارد.<br />اتصال را بررسی کنید و دوباره تلاش کنید.</p>
    <button type="button" onclick="location.replace('https://boardgameverse.ir/')">تلاش دوباره</button>
  </main>
</body>
</html>
