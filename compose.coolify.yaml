# Coolify deployment for the current LOW-TRAFFIC TEST server (Resource type: Docker Compose).
# Simplified on purpose: plain PostgreSQL with one persistent volume — no WAL archiving, no PITR, no off-site backup.
# compose.prod.yaml + docker/postgres (encrypted PITR/WAL tooling) stay for a later hardened production deployment.
# Only `web` gets a domain in Coolify (container port 8080); Coolify/Traefik terminates TLS.
#   Browser -> Coolify/Traefik -> web:8080 (Caddy) -> /api (REST + Socket.IO) -> api:3000 -> postgres:5432
# No service publishes a host port. Values come from Coolify's environment (see coolify.env.example).
name: boardgame

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  tmpfs: ["/tmp:size=16m"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-server-env: &server-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
  WEB_ORIGINS: ${WEB_ORIGINS:?set WEB_ORIGINS}
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?set PUBLIC_WEB_URL}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-none}
  ALLOW_TEST_PROVIDERS: ${ALLOW_TEST_PROVIDERS:-true}
  ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
  ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-false}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      # postgres:18 defaults to /var/lib/postgresql/18/docker; pin the data dir to the mounted volume.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - boardgame_pgdata:/var/lib/postgresql/data
    shm_size: 256m
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., dockerfile: docker/Dockerfile, target: migrate }
    <<: *hardening
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: docker/Dockerfile, target: api }
    <<: *hardening
    environment:
      <<: *server-env
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:?set OTP_HASH_SECRET}
      OTP_PROVIDER: ${OTP_PROVIDER:-fixture}
      OTP_FIXTURE_CODE: ${OTP_FIXTURE_CODE:-}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_VERIFY_TEMPLATE: ${KAVENEGAR_VERIFY_TEMPLATE:-}
      OTP_REQUESTS_PER_IP_PER_10_MIN: ${OTP_REQUESTS_PER_IP_PER_10_MIN:-10}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Coolify/Traefik -> Caddy -> API.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      TURN_TABLE_LIMIT: ${TURN_TABLE_LIMIT:-10}
      TURN_TABLE_LIMIT_PREMIUM: ${TURN_TABLE_LIMIT_PREMIUM:-30}
    stop_grace_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: ., dockerfile: docker/Dockerfile, target: worker }
    <<: *hardening
    environment:
      <<: *server-env
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-60}
    # Health endpoint listens on 127.0.0.1:3010 inside the container (image HEALTHCHECK); never exposed.
    stop_grace_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: ., dockerfile: docker/Dockerfile, target: web }
    <<: *hardening
    cap_add: [NET_BIND_SERVICE]
    # No TLS certificates to keep (Traefik terminates TLS): Caddy's state dirs are scratch tmpfs, not volumes.
    tmpfs: ["/tmp:size=16m", "/data:size=16m", "/config:size=4m"]
    environment:
      SITE_ADDRESS: :8080
      API_UPSTREAM: api:3000
    expose:
      - "8080"
    depends_on:
      api: { condition: service_healthy }

volumes:
  boardgame_pgdata:
    name: boardgame_pgdata
